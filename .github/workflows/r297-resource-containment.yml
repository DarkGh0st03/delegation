name: R297 Rust Resource Containment (No AI)
on:
  push:
    branches: [refactor/post-prof-plan-contracts-20261021]
    paths:
      - 'src/delegation/authorization/resource_uri.rs'
      - 'src/delegation/authorization/permission.rs'
      - '.github/workflows/r297-resource-containment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Verify resource and permission contracts
        run: cargo test --locked delegation::authorization::
