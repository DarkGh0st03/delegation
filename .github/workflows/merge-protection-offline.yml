# Fast, zero-AI-cost checks. Not a real merge, not a billable inference.
name: Protected Merge Offline Security Regression

on:
  push:
    branches: [feat/shared-mcp-spike]
    paths:
      - '.github/workflows/merge-protection-offline.yml'
      - '.github/workflows/human-approved-gitea-merge.yml'
      - 'poc/packages/orchestrator-runtime/src/trusted-merge.ts'
      - 'poc/packages/orchestrator-runtime/src/merge-readiness.ts'
      - 'poc/packages/orchestrator-runtime/src/manual-merge-intent.ts'
      - 'poc/packages/orchestrator-runtime/scripts/human-merge.mjs'
      - 'poc/packages/orchestrator-runtime/test/trusted-merge.test.ts'
      - 'poc/packages/orchestrator-runtime/test/manual-merge-intent.test.ts'
      - 'poc/scripts/phase10b-positive-e2e.mjs'
      - '.github/workflows/gemini-paid-shared-mcp-final.yml'
      - 'poc/packages/agent-runtime/scripts/a2a-production-coordinator-mcp-gemini-live.mjs'
      - 'poc/scripts/gemini-thinking-policy.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-merge-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-manual-merge-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - name: Install PoC dependencies without lifecycle scripts
        run: npm --prefix poc ci --ignore-scripts --no-audit --no-fund
      - name: Run full orchestrator readiness and protected-merge unit suite
        run: npm --prefix poc run orchestrator-runtime:test
      - name: Check human CLI syntax
        run: node --check poc/packages/orchestrator-runtime/scripts/human-merge.mjs
      - name: Check legacy paid E2E entrypoint syntax
        run: node --check poc/scripts/phase10b-positive-e2e.mjs
      - name: Check new paid shared-MCP entrypoint syntax
        run: node --check poc/packages/agent-runtime/scripts/a2a-production-coordinator-mcp-gemini-live.mjs
      - name: Assert live shared-MCP Gemini rejects automatic push
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_EVENT_NAME: "push"
          THESIS_PAID_GEMINI_CONFIRM: "I AUTHORIZE GEMINI API CHARGES"
        run: |
          if node --experimental-strip-types poc/packages/agent-runtime/scripts/a2a-production-coordinator-mcp-gemini-live.mjs > /tmp/shared-mcp-gemini-guard.log 2>&1; then
            echo "ERROR: billed shared-MCP entrypoint accepted an automatic push"
            exit 1
          fi
          if ! grep -q 'Live Gemini requires explicitly authorized manual GitHub dispatch' /tmp/shared-mcp-gemini-guard.log; then
            echo "ERROR: unexpected paid shared-MCP guard failure"
            exit 1
          fi
          echo "PASS: automatic shared-MCP paid inference refused"
      - name: Verify manual Gemini fails before inference when API key is absent
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_RUN_ATTEMPT: "1"
          GITHUB_REPOSITORY: DarkGh0st03/delegation
          GITHUB_REF: refs/heads/feat/shared-mcp-spike
          THESIS_PAID_GEMINI_CONFIRM: "I AUTHORIZE GEMINI API CHARGES"
        run: |
          unset GEMINI_API_KEY
          if node --experimental-strip-types poc/packages/agent-runtime/scripts/a2a-production-coordinator-mcp-gemini-live.mjs > /tmp/paid-no-key.log 2>&1; then
            echo "ERROR: manual Gemini run proceeded without credential"
            exit 1
          fi
          if ! grep -q 'Missing Gemini API key for manual run' /tmp/paid-no-key.log; then
            echo "ERROR: expected missing-key preflight was not reached"
            exit 1
          fi
          echo "PASS: manual paid run requires an explicit API credential"

      - name: Assert manual paid workflow has no automatic trigger
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),assert=require("node:assert/strict");
          const text=fs.readFileSync(".github/workflows/gemini-paid-shared-mcp-final.yml","utf8");
          const match=/^on:\s*\n([\s\S]*?)^permissions:/m.exec(text);
          assert.ok(match,"Manual Gemini workflow trigger block missing");
          assert.match(match[1],/^  workflow_dispatch:/m);
          assert.doesNotMatch(match[1],/^  (push|schedule|pull_request|workflow_run|workflow_call):/m);
          const source=fs.readFileSync("poc/packages/agent-runtime/scripts/a2a-production-coordinator-mcp-gemini-live.mjs","utf8");
          assert.doesNotMatch(source,/ACCOUNT_SUSPENSION_REFERENCE_FILES|FixedRoleModel/);
          assert.match(source,/createGeminiAdkModel/);
          assert.match(source,/createSharedMcpHttpServer/);
          assert.match(text,/github\.run_attempt == 1/);
          assert.match(text,/inputs\.authorization == 'I AUTHORIZE GEMINI API CHARGES'/);
          console.log("PASS: paid workflow is manual-only with explicit billing intent");
          NODE
      - name: Assert live-provider inference rejects automatic pushes
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_EVENT_NAME: "push"
          PHASE10B_AGENT_ENGINE: "adk-gemini"
          PHASE10B_ORCHESTRATOR_ENGINE: "adk-scripted"
        run: |
          if node --experimental-strip-types poc/scripts/phase10b-positive-e2e.mjs > /tmp/manual-paid-gate-check.log 2>&1; then
            echo "ERROR: live agent mode accepted a non-manual push"
            exit 1
          fi
          if ! grep -q 'Live model API calls require an explicit manual GitHub dispatch' /tmp/manual-paid-gate-check.log; then
            echo "ERROR: paid-mode guard did not cause the rejection"
            exit 1
          fi
          echo "Paid inference requires manual dispatch -- automatic push rejected"
      - name: Prove CLI denies accidental untrusted local execution
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: |
          if node --experimental-strip-types poc/packages/orchestrator-runtime/scripts/human-merge.mjs --execute; then
            echo "ERROR: manual-only merge script executed outside trusted dispatch"
            exit 1
          fi
          echo "Expected fail-closed denial confirmed"
