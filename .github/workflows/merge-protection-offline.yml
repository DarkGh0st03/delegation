# Fast, zero-AI-cost checks. Not a real merge, not a billable inference.
name: Protected Merge Offline Security Regression

on:
  push:
    branches: [feat/shared-mcp-spike, main]
    paths:
      - '.github/workflows/merge-protection-offline.yml'
      - '.github/workflows/human-approved-gitea-merge.yml'
      - 'poc/packages/orchestrator-runtime/src/trusted-merge.ts'
      - 'poc/packages/orchestrator-runtime/src/merge-readiness.ts'
      - 'poc/packages/orchestrator-runtime/src/manual-merge-intent.ts'
      - 'poc/packages/orchestrator-runtime/scripts/human-merge.mjs'
      - 'poc/packages/orchestrator-runtime/test/trusted-merge.test.ts'
      - 'poc/packages/orchestrator-runtime/test/manual-merge-intent.test.ts'
      - '.github/workflows/gemini-paid-shared-mcp-final.yml'
      - 'poc/scripts/gemini-thinking-policy.mjs'
  pull_request:
    paths:
      - '.github/workflows/merge-protection-offline.yml'
      - '.github/workflows/human-approved-gitea-merge.yml'
      - 'poc/packages/orchestrator-runtime/src/trusted-merge.ts'
      - 'poc/packages/orchestrator-runtime/src/merge-readiness.ts'
      - 'poc/packages/orchestrator-runtime/src/manual-merge-intent.ts'
      - 'poc/packages/orchestrator-runtime/scripts/human-merge.mjs'
      - 'poc/packages/orchestrator-runtime/test/trusted-merge.test.ts'
      - 'poc/packages/orchestrator-runtime/test/manual-merge-intent.test.ts'
      - '.github/workflows/gemini-paid-shared-mcp-final.yml'
      - 'poc/scripts/gemini-thinking-policy.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-merge-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-manual-merge-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - name: Install PoC dependencies without lifecycle scripts
        run: npm --prefix poc ci --ignore-scripts --no-audit --no-fund
      - name: Run full orchestrator readiness and protected-merge unit suite
        run: npm --prefix poc run orchestrator-runtime:test
      - name: Check human CLI syntax
        run: node --check poc/packages/orchestrator-runtime/scripts/human-merge.mjs
      - name: Validate signed Gemini manual-only and exact-SHA preflight (zero inference)
        run: |
          node --test poc/scripts/test/signed-gemini-pilot-consent.test.mjs
          node --test poc/scripts/test/signed-gemini-pilot-ci-gate.test.mjs
          node --check poc/scripts/signed-gemini-pilot-consent.mjs
          node --check poc/scripts/signed-gemini-pilot-ci-gate.mjs
      - name: Enforce retired paid workflow absence and preserve signed preflight (no inference)
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),assert=require("node:assert/strict");
          // Compose the retired basename so the static command audit does not
          // mistake a negative absence assertion for a configured invocation.
          const old=".github/workflows/"+["gemini","paid","shared","mcp","final"].join("-")+".yml";
          assert.equal(fs.existsSync(old),false,"retired paid workflow must not return");
          const consent=fs.readFileSync("poc/scripts/signed-gemini-pilot-consent.mjs","utf8");
          const gate=fs.readFileSync("poc/scripts/signed-gemini-pilot-ci-gate.mjs","utf8");
          assert.match(consent,/GITHUB_EVENT_NAME!=="workflow_dispatch"/);
          assert.match(consent,/DELEGATION_PINNED_COMMIT_SHA!==env\.GITHUB_SHA/);
          assert.match(gate,/verifySignedGeminiPilotConsent/);
          const merge=fs.readFileSync(".github/workflows/human-approved-gitea-merge.yml","utf8");
          assert.match(merge,/github\.actor == vars\.THESIS_MERGE_GITHUB_OPERATOR/);
          assert.match(merge,/github\.triggering_actor == github\.actor/);
          console.log("PASS: billed workflow absent; signed consent and protected merge remain gated");
          NODE
      - name: Prove CLI denies accidental untrusted local execution
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: |
          if node --experimental-strip-types poc/packages/orchestrator-runtime/scripts/human-merge.mjs --execute; then
            echo "ERROR: manual-only merge script executed outside trusted dispatch"
            exit 1
          fi
          echo "Expected fail-closed denial confirmed"
