# NON-BILLABLE private GitHub OIDC admission ONLY.
# Requires an isolated, explicitly provisioned self-hosted runner with a
# preinstalled Node 22 runtime and out-of-band owner-only mTLS config.
# Do NOT use a GitHub-hosted runner, public proxy or untrusted PR runner.
# A valid run never signs an Engineer plan, activates Rust/Gateway or uses Gemini.
name: Trusted Private Runner OIDC Admission (No Models)
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Explicit future model charge consent; this workflow NEVER uses an API"
        required: true
        type: string
      model:
        description: "Model value bound to authenticated admission only"
        type: string
        required: true
        default: "gemini-3.8-flash"
      max_model_turns:
        type: string
        required: true
        default: "12"
      max_output_tokens:
        type: string
        required: true
        default: "16000"
      max_model_call_ms:
        type: string
        required: true
        default: "120000"
permissions:
  contents: read
  id-token: write
concurrency:
  group: trusted-private-runner-oidc-admission
  cancel-in-progress: false
jobs:
  private-admission-only:
    name: Authenticate job on private Engineer intake, no approval
    # The operator must configure this environment with required reviewers.
    # Approval to START an admission is not the Engineer's Ed25519 plan signature.
    environment: r5-private-admission
    runs-on: [self-hosted, linux, x64, delegation-private]
    # Avoid allocating the privileged runner for unrelated branches/forks.
    # Also restrict the runner group to this exact workflow and protected ref.
    if: ${{ github.repository == 'DarkGh0st03/delegation' && github.ref == 'refs/heads/refactor/post-prof-plan-contracts-20261021' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 }}
    timeout-minutes: 8
    steps:
      # SECURITY: do NOT checkout a mutable branch or run arbitrary npm/setup
      # actions on a runner holding an independently provisioned mTLS key.
      # Operator installs a reviewed, immutable build of the submission
      # client and its local imports under /opt/delegation/r5/ ahead of time.
      # Provision DELEGATION_RUNNER_OIDC_CONFIG as a private runner service
      # variable; never as workflow_dispatch data or GitHub repository secrets.
      - name: Submit protected runner OIDC to private Engineer host
        shell: bash
        run: node --experimental-strip-types /opt/delegation/r5/poc/apps/orchestrator/src/submit-private-github-oidc.mjs
      - name: State explicitly that no authority or Gemini was created
        run: |
          echo "GitHub job identity submitted only. Engineer signature NOT granted."
          echo "No operational Rust DC, Gateway plan, A2A execution or Gemini calls."
