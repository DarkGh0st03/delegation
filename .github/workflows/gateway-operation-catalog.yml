name: Gateway Rust Operation Catalog (Offline)
on:
  workflow_dispatch:
  push:
    branches:
      - refactor/post-prof-plan-contracts-20261021
    paths:
      - "poc/apps/gateway/**"
      - "poc/opa/**"
      - "poc/scripts/phase4a-policy-test.sh"
      - "poc/scripts/sync-rust-operation-catalog.mjs"
      - "src/delegation/authorization/operation.rs"
      - ".github/workflows/gateway-operation-catalog.yml"
  pull_request:
    paths:
      - "poc/apps/gateway/**"
      - "poc/opa/**"
      - "poc/scripts/phase4a-policy-test.sh"
      - "poc/scripts/sync-rust-operation-catalog.mjs"
      - "src/delegation/authorization/operation.rs"
      - ".github/workflows/gateway-operation-catalog.yml"
permissions:
  contents: read
jobs:
  gateway-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
      # R135's Gateway/Orchestrator cross-boundary A2A regression uses the
      # existing pinned SDK, which is not available in a bare checkout.
      # This is npm install only; no LLM API calls or paid provider runs.
      - name: Install pinned local A2A workspace dependencies (no AI calls)
        run: npm --prefix poc ci --ignore-scripts --no-audit --no-fund
      - name: Check Rust Operation catalog matches generated Gateway TypeScript
        run: node poc/scripts/sync-rust-operation-catalog.mjs --check
      - name: Test Gateway authorization, provider and operation contracts (offline)
        run: node --experimental-strip-types --test poc/apps/gateway/test/*.test.ts
      - name: Verify actual OPA read-only policy and denial regressions
        run: bash poc/scripts/phase4a-policy-test.sh
