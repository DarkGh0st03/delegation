# R463: strict paid Engineer Host configuration-only test. NO private config,
# mTLS contacts, Github OIDC, model API, approval, Root or production runner.
name: R463 Paid Engineer Host Preflight (No AI)
on:
  workflow_dispatch:
  push:
    branches: [refactor/post-prof-plan-contracts-20261021]
    paths:
      - '.github/workflows/r463-paid-engineer-host-preflight.yml'
      - 'poc/scripts/r463-gemini-private-host-preflight.mjs'
      - 'poc/scripts/test/r463-gemini-private-host-preflight.test.mjs'
permissions:
  contents: read
concurrency:
  group: r463-paid-engineer-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Refuse billable provider and require local TLS fixture only
        shell: bash
        run: |
          test -z "${GEMINI_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          test "${DELEGATION_SIGNED_GEMINI_PILOT:-0}" != 1
          command -v openssl >/dev/null
      - name: Offline paid-Host configuration and negative TLS/identity tests
        run: |
          node --check poc/scripts/r463-gemini-private-host-preflight.mjs
          node --test poc/scripts/test/r463-gemini-private-host-preflight.test.mjs
      - name: Explicitly deny claims of live deployment
        run: |
          echo "R463 pure no-provider config checks only."
          echo "No private Engineer Host, signed approval, OIDC or Gemini model exercised."
