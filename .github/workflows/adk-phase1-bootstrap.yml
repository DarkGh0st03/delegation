name: ADK Phase 1 Bootstrap

on:
  push:
    branches:
      - refactor/adk-integration
    paths:
      - 'poc/adk-spike/**'
      - '.github/workflows/adk-phase1-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: adk-phase1-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Generate reproducible lockfile for isolated ADK spike
        run: npm --prefix poc/adk-spike install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependencies
        run: npm --prefix poc/adk-spike ci --ignore-scripts --no-audit --no-fund
      - name: Run ADK API/session smoke
        run: npm --prefix poc/adk-spike run smoke
      - name: Commit generated lockfile after successful smoke
        run: |
          if ! git diff --quiet -- poc/adk-spike/package-lock.json || test -n "$(git ls-files --others --exclude-standard poc/adk-spike/package-lock.json)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add poc/adk-spike/package-lock.json
            git commit -m "build: pin isolated ADK spike dependency tree"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
