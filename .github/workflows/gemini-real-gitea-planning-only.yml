# ONE manual and potentially billed Planner attempt. No paid push or schedule.
# This job shares the real-Gitea F1 preliminary host with the full D0 pilot
# but stops before Engineer approval, operational root, Agent A2A and PR.
name: Gemini Real Gitea Planning-only (Manual, Billed)
on:
  # Branch-only registration: free, no secrets, no model construction.
  # The billed job below is gated EXCLUSIVELY on workflow_dispatch.
  push:
    branches: [refactor/post-prof-plan-contracts-20261021]
    paths:
      - '.github/workflows/gemini-real-gitea-planning-only.yml'
      - '.github/workflows/gemini-paid-shared-mcp-final.yml'
      - 'poc/scripts/real-gitea-planning-mode.mjs'
      - 'poc/scripts/test/real-gitea-planning-mode.test.mjs'
      - 'poc/scripts/test/f1-registered-manual-workflow.test.mjs'
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type exactly I AUTHORIZE GEMINI API CHARGES'
        type: string
        required: true
      pinned_commit_sha:
        description: '40-char commit SHA with all 3 Full CI SUCCESS on this exact SHA'
        type: string
        required: true
      billing_cap_acknowledgement:
        description: 'Type I VERIFIED PROJECT SPEND CAP AND UNDERSTAND POSSIBLE OVERAGES'
        type: string
        required: true
permissions:
  contents: read
  actions: read
# Mutually exclude this isolated paid Planner from the complete paid D0 run.
concurrency:
  group: refactor-one-use-four-gemini-${{ github.ref }}
  cancel-in-progress: false
jobs:
  register-no-inference:
    if: github.event_name == 'push'
    name: Register branch workflow and test F1 consent without inference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
      - name: Fail-closed F1 operator consent unit tests (NO GEMINI KEY)
        env:
          DELEGATION_F1_PAID_PLANNING_ONLY: "0"
          DELEGATION_SIGNED_GEMINI_PILOT: "0"
          GEMINI_API_KEY: ""
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          node --test poc/scripts/test/real-gitea-planning-mode.test.mjs
          node --test poc/scripts/test/f1-registered-manual-workflow.test.mjs
          node --check poc/apps/gateway/native-test/native-planning-read-core-evm-e2e.mjs
          node --check poc/apps/test-runner-controller/scripts/isolated-trusted-security-ci-positive-smoke.mjs
  real-planner:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DarkGh0st03/delegation' &&
      github.ref == 'refs/heads/refactor/post-prof-plan-contracts-20261021' &&
      github.run_attempt == 1 &&
      inputs.authorization == 'I AUTHORIZE GEMINI API CHARGES' &&
      inputs.billing_cap_acknowledgement == 'I VERIFIED PROJECT SPEND CAP AND UNDERSTAND POSSIBLE OVERAGES' &&
      inputs.pinned_commit_sha == github.sha
    name: One signed preliminary ADK Planner, no approval (potentially billed)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ADAPTER_TRUST_PROFILE: evm
      ADAPTER_CALLER_ENGINEER: local-native-engineer-ci
      ADAPTER_CALLER_GATEWAY: local-native-gateway-ci
      ADAPTER_CALLER_ORCHESTRATOR: local-native-orchestrator-ci
      ADAPTER_CALLER_BACKEND: local-native-backend-ci
      ADAPTER_CALLER_FRONTEND: local-native-frontend-ci
      ADAPTER_CALLER_TEST: local-native-test-ci
      ADAPTER_ID_GATEWAY: urn:thesis:service:gateway
      ADAPTER_BIND_ADDR: 127.0.0.1:8090
      GATEWAY_BIND_ADDR: 127.0.0.1:8080
      GATEWAY_VERIFIER_MODE: core-rust
      GATEWAY_PROVIDER_MODE: mock
      GATEWAY_AUDIENCE: cloud-access-gateway
      GATEWAY_REQUEST_TTL_MS: "120000"
      GATEWAY_RESOURCE_AUTHORITY: gitea.local
      GITEA_OWNER: thesis
      GITEA_REPOSITORY: iam-console-poc
      OPA_URL: http://127.0.0.1:8181
      OPA_TIMEOUT_MS: "2000"
      RPC_URL: http://127.0.0.1:8545
      CHAIN_ID: "31337"
      ADAPTER_PUBLIC_ARTIFACT_DIR: /tmp/delegation-native-public
      CORE_RUST_PUBLIC_ARTIFACT_DIR: /tmp/delegation-native-public
      CORE_RUST_RPC_URL: http://127.0.0.1:8545
      CORE_RUST_CHAIN_ID: "31337"
      DELEGATION_F1_PAID_PLANNING_ONLY: "1"
      DELEGATION_SIGNED_GEMINI_PILOT: "1"
      DELEGATION_GEMINI_MODEL: gemini-3.8-flash
      DELEGATION_GEMINI_CHARGE_CONFIRMATION: ${{ inputs.authorization }}
      DELEGATION_PINNED_COMMIT_SHA: ${{ inputs.pinned_commit_sha }}
      DELEGATION_BILLING_CAP_ACK: ${{ inputs.billing_cap_acknowledgement }}
      DELEGATION_SIGNED_GEMINI_REPAIR_D1: "0"
      DELEGATION_GEMINI_REPAIR_CHARGE_CONFIRMATION: NO ADDITIONAL REPAIR AUTHORIZED
      APPROVED_RUNNER_SCENARIO: account-suspension
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - name: Install pinned local Node and DID dependencies
        run: |
          npm --prefix poc ci --ignore-scripts --no-audit --no-fund
          npm --prefix blockchain/did-client ci --ignore-scripts --no-audit --no-fund
          node poc/scripts/init-local-env.mjs --force
      - name: Exact manual consent, isolated bounds, and signed same-SHA CI gate (NO model call)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --test poc/scripts/test/real-gitea-planning-mode.test.mjs
          node --test poc/scripts/test/signed-gemini-pilot-ci-gate.test.mjs
          node poc/scripts/signed-gemini-pilot-consent.mjs --preflight-no-inference
          node poc/scripts/signed-gemini-pilot-ci-gate.mjs --check-ci-no-inference
          node --check poc/apps/gateway/native-test/native-planning-read-core-evm-e2e.mjs
          node --check poc/apps/test-runner-controller/scripts/isolated-trusted-security-ci-positive-smoke.mjs
      - name: Start only disposable Anvil and OPA
        run: |
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml up -d anvil opa
          for i in {1..90}; do
            if cast chain-id --rpc-url "$RPC_URL" >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:8181/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.5
          done
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml ps
          exit 1
      - name: Generate disposable public test identities
        run: |
          local_key() { printf '0x%064x' "$1"; }
          deployer_key="$(local_key 1)"
          deployer_address="$(cast wallet address --private-key "$deployer_key")"
          cast rpc --rpc-url "$RPC_URL" anvil_setBalance "$deployer_address" 0x56BC75E2D63100000 >/dev/null
          echo "ANVIL_DEPLOYER_PRIVATE_KEY=$deployer_key" >> "$GITHUB_ENV"
          echo "GOVERNANCE_PRIVATE_KEY=$deployer_key" >> "$GITHUB_ENV"
          for entry in ENGINEER:2 ORCHESTRATOR:3 BACKEND:4 FRONTEND:5 TEST:6; do
            role="${entry%%:*}"
            n="${entry##*:}"
            key="$(local_key "$n")"
            address="$(cast wallet address --private-key "$key")"
            cast rpc --rpc-url "$RPC_URL" anvil_setBalance "$address" 0x56BC75E2D63100000 >/dev/null
            echo "ADAPTER_EVM_PRIVATE_KEY_${role}=$key" >> "$GITHUB_ENV"
            echo "ADAPTER_ID_${role}=did:ethr:0x7a69:${address}" >> "$GITHUB_ENV"
          done
      - name: Deploy public DID and EVM trust registries
        run: |
          bash poc/scripts/bootstrap-trust.sh
          set -a
          source poc/infra/runtime/trust.env
          set +a
          for key in DID_REGISTRY_ADDRESS ENTERPRISE_TRUST_REGISTRY_ADDRESS ISSUER_REGISTRY_ADDRESS; do
            echo "$key=${!key}" >> "$GITHUB_ENV"
          done
          echo "CORE_RUST_DID_REGISTRY_ADDRESS=$DID_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_ENTERPRISE_REGISTRY_ADDRESS=$ENTERPRISE_TRUST_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_ISSUER_REGISTRY_ADDRESS=$ISSUER_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_DID_RESOLVER_SCRIPT=$GITHUB_WORKSPACE/blockchain/did-client/resolve-did-json.mjs" >> "$GITHUB_ENV"
      - name: Build signed-credential Adapter and native Core Rust addon
        run: |
          cargo build --manifest-path services/delegation-adapter/Cargo.toml --locked
          cargo build --release --manifest-path services/delegation-core-node/Cargo.toml
          mkdir -p poc/apps/gateway/src/native "$ADAPTER_PUBLIC_ARTIFACT_DIR"
          cp services/delegation-core-node/target/release/libdelegation_core_node.so poc/apps/gateway/src/native/delegation-core.node
      - name: Start Adapter with public-only shared verification artifacts
        run: |
          cargo run --manifest-path services/delegation-adapter/Cargo.toml --locked > /tmp/native-evm-adapter.log 2>&1 &
          echo $! > /tmp/native-evm-adapter.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/native-evm-adapter.log
          exit 1
      - name: Start Gateway using only the native Rust Core verifier
        run: |
          npm --prefix poc run gateway:start > /tmp/native-evm-gateway.log 2>&1 &
          echo $! > /tmp/native-evm-gateway.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/native-evm-gateway.log
          exit 1
      - name: Preload disposable Gitea, OPA and Docker acceptance images
        run: |
          docker pull docker.gitea.com/gitea:28.0.0
          docker pull node:22.15.0-bookworm
          docker pull openpolicyagent/opa:1.21.1
      - name: ONE explicitly authorized Gemini Planner on REAL disposable Gitea (BILLED)
        env:
          GEMINI_API_KEY: ${{ secrets.Delegation_Thesis_Gemini }}
          APPROVED_RUNNER_REAL_GITEA_PLANNING_ONLY: "1"
          APPROVED_RUNNER_NATIVE_EVM: "1"
          APPROVED_RUNNER_THREE_AGENT_DAG: "1"
          APPROVED_RUNNER_HOST_SELECTED_ADK_MODELS: "1"
          APPROVED_RUNNER_SCENARIO: account-suspension
          GITEA_ADMIN_USER: isolated_admin
          GITEA_ADMIN_PASSWORD: local-planner-${{ github.run_id }}-${{ github.run_attempt }}
          GITEA_IMAGE: docker.gitea.com/gitea:28.0.0
          TEST_RUNNER_DOCKER_IMAGE: node:22.15.0-bookworm
          OPA_IMAGE: openpolicyagent/opa:1.21.1
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          node --input-type=module <<'NODE'
          import {verifyRealGiteaPlanningMode} from "./poc/scripts/real-gitea-planning-mode.mjs";
          if(verifyRealGiteaPlanningMode(process.env,{parent:true})!=="gemini")
            throw Error("Manual real Gitea Planner billing mode NO-GO");
          NODE
          # Never print raw model input, source files, API responses or Gitea PAT.
          if ! npm --prefix poc run security-ci:isolated-positive-smoke -w @thesis/test-runner-controller > /tmp/paid-f1-planner-private.log 2>&1; then
            echo "::error::Real Gitea Gemini Planning-only rejected; no Engineer approval or A2A execution"
            grep -E '^\[f1-real-gemini\] ' /tmp/paid-f1-planner-private.log || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          import {extractSafeGeminiPilotUsage}
            from "./poc/scripts/signed-gemini-pilot-usage.mjs";
          const data=readFileSync("/tmp/paid-f1-planner-private.log","utf8");
          const receipt=data.split(/\r?\n/u).filter(Boolean).map(line=>{
            if(line.length>4096||!line.startsWith("{"))return null;
            try{return JSON.parse(line);}catch{return null;}
          }).find(x=>x?.event==="f1_real_gitea_planning_only_verified");
          assert.equal(receipt?.status,"pass");
          assert.equal(receipt?.model_source,"real_gemini");
          assert.equal(receipt?.approval_created,false);
          assert.equal(receipt?.operational_root_issued,false);
          assert.equal(receipt?.provider_writes,0);
          assert.equal(receipt?.pr_created,false);
          assert.ok(receipt?.gemini_calls>0&&receipt.gemini_calls<=24);
          const usage=extractSafeGeminiPilotUsage(data);
          console.log(JSON.stringify({
            event:"real_gitea_gemini_planning_only",
            status:"unapproved_proposal_verified",
            input_manifest_digest:receipt.input_manifest_digest,
            source_revision:receipt.source_revision,
            gemini_delegate_calls:receipt.gemini_calls,
            model_usage:usage.role_usage.planner,
            observation_integrity:usage.observation_integrity,
            approval_created:false,child_dc_issued:0,
            provider_writes:0,pr_created:false
          }));
          NODE
      - name: Stop disposable services
        if: always()
        run: |
          kill "$(cat /tmp/native-evm-gateway.pid)" 2>/dev/null || true
          kill "$(cat /tmp/native-evm-adapter.pid)" 2>/dev/null || true
          if [[ -f poc/infra/.env ]]; then
            docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml down || true
          fi
