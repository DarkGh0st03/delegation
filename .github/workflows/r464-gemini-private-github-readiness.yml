# R464: no-AI offline tests of the PAID private Gemini GitHub
# administration preflight. CI cannot read admin settings or trust a
# self-hosted runner; ONLY operator-only code can perform live GET checks.
name: R464 Paid Private GitHub Controls Contracts (No AI)
on:
  workflow_dispatch:
  push:
    branches: [refactor/post-prof-plan-contracts-20261021]
    paths:
      - '.github/workflows/r464-gemini-private-github-readiness.yml'
      - 'poc/scripts/r464-gemini-private-github-readiness.mjs'
      - 'poc/scripts/test/r464-gemini-private-github-readiness.test.mjs'
permissions:
  contents: read
concurrency:
  group: r464-paid-private-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Deny operational secrets and billable execution
        shell: bash
        run: |
          test -z "${GEMINI_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${DELEGATION_R5_OPERATOR_GITHUB_TOKEN_FILE:-}"
      - name: Run all paid-admin deny/pass synthetic HTTP tests
        run: |
          node --check poc/scripts/r464-gemini-private-github-readiness.mjs
          node --test poc/scripts/test/r464-gemini-private-github-readiness.test.mjs
      - name: Explicit non-deployment finding
        run: |
          echo "R464 TESTS ONLY: no live GitHub admin, no actual private runner proof."
          echo "Engineer Host and paid Gemini R5 GO remain unverified."
