          node --experimental-strip-types --test poc/packages/agent-runtime/test/approved-specialized-profiles.test.ts poc/packages/agent-runtime/test/specialized-agents.test.ts poc/packages/agent-runtime/test/local-crypto-mcp-bridge.test.ts poc/packages/agent-runtime/test/native-crypto-ipc.test.ts
          node --test poc/packages/agent-runtime/test/r238-scenario-fixture-isolation.test.mjs
          node --test poc/scripts/test/r239-canonical-agent-no-adapter-url.test.mjs
          node --test poc/scripts/test/r240-direct-rust-issuer-config.test.mjs
          # R385.0: legacy MCP/HTTP Engineer path is lazy; native direct Rust path stays first.
          node --test poc/scripts/test/r3850-engineer-issuer-boundary.test.mjs
          # R385.2: pure endpoint preflight, lazy DAG import and original root-retirement safety.
          node --experimental-strip-types --test poc/scripts/test/r3852-reviewed-dag-runtime-isolation.test.mjs
          # R385.3: lazy historical repair planner + DAG only under verified Test FAIL.
