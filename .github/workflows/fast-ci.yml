          node --experimental-strip-types --test --test-name-pattern="R123 owner recovery arms|R124 live Engineer owner|R124 stale trusted Gitea|R124 malicious model grant|R124 root revoked mid-proposal|R138 owner-only repair" poc/apps/gateway/test/operational-epoch-gateway.test.ts
          node --experimental-strip-types --test poc/packages/orchestrator-runtime/test/trusted-reviewed-approved-dag.test.ts
          node --experimental-strip-types --test poc/packages/orchestrator-runtime/test/trusted-engineer-crypto-port.test.ts
          node --experimental-strip-types --test poc/packages/orchestrator-runtime/test/trusted-engineer-native-port.test.ts
          node --experimental-strip-types --test poc/packages/agent-runtime/test/native-agent-card-signer-binding.test.ts poc/packages/orchestrator-runtime/test/trusted-a2a-startup-probe.test.ts
          node --experimental-strip-types --test poc/apps/orchestrator/test/trusted-authority-only-owner-bootstrap.test.mjs
          node --experimental-strip-types --test poc/apps/orchestrator/test/trusted-authority-only-native-create-effects.test.mjs
          node --test poc/apps/orchestrator/test/trusted-authority-only-gemini-owner-binding.test.mjs
          # R384.6: no legacy billed pipeline may be re-enabled.
