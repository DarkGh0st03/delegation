name: Fast CI - Development
on:
  push:
    branches: [refactor/post-prof-plan-contracts-20261021]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-contracts:
    name: Fast offline Node contracts and MCP integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: |
            poc/package-lock.json
            poc/mcp-shared/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm --prefix poc ci --ignore-scripts --no-audit --no-fund
          npm --prefix poc/mcp-shared ci --ignore-scripts --no-audit --no-fund
      - name: Scaffold, imports and type-only contracts
        run: |
          npm --prefix poc run check:scaffold
          npm --prefix poc run check:imports
          npm --prefix poc run audit:r6:types
          npm --prefix poc run audit:r6:runtime-named
      - name: Authorization plan contracts and Gateway
        run: |
          node --test poc/packages/plan-contracts/test/*.test.mjs
          node --experimental-strip-types --test poc/apps/gateway/test/prepare.test.ts poc/apps/gateway/test/operation-catalog.test.ts poc/apps/gateway/test/planning-revision-pinning.test.ts
      - name: ADK, A2A and real loopback shared MCP
        run: |
          node --experimental-strip-types --test poc/packages/agent-runtime/test/gateway-tool-client.test.ts poc/packages/agent-runtime/test/private-mcp-task-registry.test.ts poc/packages/agent-runtime/test/adk-specialized-agents.test.ts poc/packages/agent-runtime/test/adk-native-mcp-integration.test.ts
          npm --prefix poc/mcp-shared test
          node --experimental-strip-types --test poc/packages/orchestrator-runtime/test/a2a-workflow.test.ts poc/packages/orchestrator-runtime/test/trusted-gemini-repair-proposer.test.mjs
      - name: Pilot gate and bounded diagnostics without inference
        run: |
          node --test poc/scripts/test/signed-gemini-pilot-ci-gate.test.mjs poc/scripts/test/private-evidence-workflow-preflight.test.mjs poc/scripts/test/signed-gemini-pilot-consent.test.mjs poc/scripts/test/signed-gemini-pilot-usage.test.mjs poc/scripts/test/signed-gemini-pilot-failure-observation.test.mjs
          node --test poc/apps/gateway/native-test/d1-editor-revision.test.mjs poc/apps/gateway/native-test/d1-gateway-operation-audit.test.mjs
      - name: Private Runner evidence without inference
        run: node --experimental-strip-types --test poc/apps/test-runner-controller/test/failure-evidence.test.ts poc/apps/test-runner-controller/test/private-vitest-failures.test.ts poc/scripts/test/seal-runner-evidence.test.mjs
      - name: Recovery scope, signed task context and owner handoff (no model calls)
        run: |
          node --experimental-strip-types --test poc/apps/gateway/native-test/f4-project-test-provenance.test.mjs poc/apps/gateway/native-test/f4-controlled-retest-evidence.test.mjs poc/apps/gateway/native-test/project-test-repair-candidate-scope.test.mjs poc/packages/orchestrator-runtime/test/trusted-approved-a2a-dispatcher.test.ts poc/packages/orchestrator-runtime/test/trusted-adk-integration-review.test.ts poc/packages/orchestrator-runtime/test/trusted-adk-planner.test.ts poc/packages/orchestrator-runtime/test/offline-planning-dag.test.ts poc/apps/gateway/native-test/f1-planner-ablation.test.mjs
          node --experimental-strip-types --test poc/apps/gateway/native-test/native-owner-d1-task-selection.test.mjs poc/apps/gateway/native-test/verified-failed-generated-test-selection.test.mjs poc/apps/gateway/native-test/verified-generated-test-edit-scope.test.mjs poc/apps/gateway/native-test/trusted-d1-repair-scope-choice.test.mjs poc/apps/gateway/native-test/trusted-d1-gemini-investigation-choice.test.mjs poc/apps/gateway/native-test/trusted-d1-signed-task-schedule.test.mjs poc/packages/orchestrator-runtime/test/trusted-adk-operational-repair-proposer.test.ts poc/packages/orchestrator-runtime/test/trusted-runner-assertion-context.test.ts
          node --experimental-strip-types --test --test-name-pattern='R148 one original Test FAIL|R135 signed repair grants|T4 insufficient evidence|D1 private assertion reaches protected' poc/apps/gateway/test/operational-epoch-gateway.test.ts
      - name: Generated Test Gitea/Docker host syntax and isolated preliminary safety (no model calls)
        run: |
          node --check poc/apps/gateway/native-test/native-planning-read-core-evm-e2e.mjs
          node --check poc/apps/gateway/native-test/native-approved-planner-dag-positive.mjs
          node --check poc/apps/gateway/native-test/approved-plan-offline-adk-call-scripts.mjs
          node --check poc/apps/test-runner-controller/scripts/isolated-trusted-security-ci-positive-smoke.mjs
          node --experimental-strip-types --test poc/apps/test-runner-controller/test/native-preliminary-environment.test.ts
      - name: Generated Test edit, fresh validation and final acceptance selection (no model calls)
        run: |
          node --experimental-strip-types --test poc/apps/gateway/native-test/approved-plan-offline-adk-call-scripts.test.mjs poc/apps/gateway/native-test/offline-approved-adk-model.test.mjs poc/apps/gateway/native-test/d1-editor-revision.test.mjs poc/packages/orchestrator-runtime/test/repair-final-test-task.test.ts
          node --experimental-strip-types --test --test-name-pattern='Generated Test D1 selector|R137 signed DAG|R141 original root capture|R142|R145' poc/apps/gateway/test/operational-epoch-gateway.test.ts
  runner-evidence-docker:
    name: Real Docker failure evidence round trip (no AI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Prepare fixed Runner image
        run: docker pull node:22.15.0-bookworm
      - name: Docker FAIL, retain, encrypt, discard plaintext and recover
        env:
          RUNNER_EVIDENCE_REAL_DOCKER: '1'
        run: node --experimental-strip-types --test poc/apps/test-runner-controller/test/failure-evidence-docker.test.ts
