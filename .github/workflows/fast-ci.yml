name: Fast CI - Development
on:
  push:
    branches: [refactor/post-prof-plan-contracts-20261021]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-contracts:
    name: Fast offline Node contracts and MCP integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: |
            poc/package-lock.json
            poc/mcp-shared/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm --prefix poc ci --ignore-scripts --no-audit --no-fund
          npm --prefix poc/mcp-shared ci --ignore-scripts --no-audit --no-fund
      - name: Scaffold, imports and type-only contracts
        run: |
          npm --prefix poc run check:scaffold
          npm --prefix poc run check:imports
          # R402: static inventory only; unresolved edges explicitly retained. Never delete files based on reachability.
          node --experimental-vm-modules --test poc/scripts/test/r402-reachability-coverage-inventory.test.mjs
          node --experimental-vm-modules poc/scripts/r402-reachability-coverage-inventory.mjs --out /tmp/r402-static-inventory.json
          # R403: inspect milestone docs and exact tracked-source references before retirement.
          node --experimental-vm-modules --test poc/scripts/test/r403-document-retirement-classifier.test.mjs
          node --experimental-vm-modules poc/scripts/r403-document-retirement-classifier.mjs --out /tmp/r403-document-review.json
          # R404: configured test provenance, not execution or deletion proof.
          node --experimental-vm-modules --test poc/scripts/test/r404-test-and-script-coverage-audit.test.mjs
          node --experimental-vm-modules poc/scripts/r404-test-and-script-coverage-audit.mjs --out /tmp/r404-test-configuration.json
          npm --prefix poc run audit:r6:references
          # R385.4: never add new production imports, computed loaders or configured launchers to retained signed-DAG modules.
          node --experimental-vm-modules poc/scripts/r3854-legacy-dag-closure-audit.mjs
          node --experimental-vm-modules --test poc/scripts/test/r3854-legacy-dag-closure-audit.test.mjs
          # R385.16: read-only Human Gate and exact legacy edge inventory; never execute merge or models.
          node --experimental-vm-modules poc/scripts/r38516-human-gate-and-legacy-reachability.mjs
          node --experimental-vm-modules --test poc/scripts/test/r38516-human-gate-and-legacy-reachability.test.mjs
          # R385.17: exact workflow routes, per-caller parsed importer provenance, and private crypto-MCP retention; NO deletion/paid model.
          node --experimental-vm-modules poc/scripts/r38517-canonical-route-closure.mjs
          node --experimental-vm-modules --test poc/scripts/test/r38517-canonical-route-closure.test.mjs
          # R406: neutral typed D1 proposal boundary, no runtime/credential activation.
          node --experimental-vm-modules --experimental-strip-types --test poc/scripts/test/r406-neutral-repair-model-contract.test.mjs
          # R407: historical Runner issuer is late-loaded only under gated legacy EVM fixture.
          node --experimental-vm-modules --test poc/scripts/test/r407-historical-runner-issuer-isolation.test.mjs
          # R408: the 3 signed Owner handoffs load the new DAG core, never the old shim.
          node --experimental-vm-modules --experimental-strip-types --test poc/scripts/test/r408-reviewed-dag-caller-migration.test.mjs
          # R385.16: mock-only negative Human Gate, actor, review, protected branch and exact SHA tests. Never dispatch merge.
          node --experimental-strip-types --test poc/packages/orchestrator-runtime/test/manual-merge-intent.test.ts poc/packages/orchestrator-runtime/test/merge-readiness.test.ts poc/packages/orchestrator-runtime/test/trusted-security-ci-merge-readiness-link.test.ts poc/packages/orchestrator-runtime/test/trusted-merge.test.ts
          node --experimental-vm-modules --test poc/scripts/test/r6-configured-command.test.mjs
          node --experimental-vm-modules --test poc/scripts/test/r243-private-gateway-transport-audit.test.mjs
          npm --prefix poc run audit:r6:types
          npm --prefix poc run audit:r6:runtime-named
