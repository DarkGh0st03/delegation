          node --experimental-strip-types --test --test-name-pattern="R382.6|R382.7" poc/apps/orchestrator/test/run-trusted-gemini-owner.test.mjs
          node --test poc/apps/orchestrator/test/trusted-authority-only-reviewed-canonical-handoff.test.mjs
          node --experimental-strip-types --test --test-name-pattern="R382.5|R382.6" poc/apps/orchestrator/test/trusted-authority-only-review-host.test.mjs
          node --test poc/apps/orchestrator/test/trusted-gemini-owner-dispatch.test.mjs
          node --experimental-strip-types --test --test-name-pattern="R382.4" poc/apps/orchestrator/test/trusted-authority-only-review-host.test.mjs
          node --test poc/scripts/test/r3822-native-mcp-checkpoint-isolation.test.mjs
          node --test poc/scripts/test/verify-r3818-native-mcp-proof.test.mjs
          node --check poc/packages/orchestrator-runtime/test/r330-native-two-adk-a2a-frontend-test-e2e.mjs
