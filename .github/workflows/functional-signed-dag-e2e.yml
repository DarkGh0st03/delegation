      - name: Recover private evidence from application FAIL scenarios (NO AI)
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {randomBytes,createHash} from "node:crypto";
            import {readFile,rm,writeFile} from "node:fs/promises";
            import {sealDirectory,unseal} from "./poc/scripts/seal-runner-evidence.mjs";
            const directory=process.env.TEST_RUNNER_FAILURE_EVIDENCE_DIR;
            const output=process.env.RUNNER_TEMP+"/functional-private-evidence.enc";
            const key=randomBytes(32).toString("hex");
            assert.equal(await sealDirectory(directory,output,key),true);
            const recovered=JSON.parse(unseal(await readFile(output),key));
            const phases={},assertionPhases={};
            for(const bundle of recovered.bundles){
              const manifest=JSON.parse(Buffer.from(bundle.files["manifest.json"],"base64"));
              assert.match(manifest.tested_commit_sha,/^[a-f0-9]{40}$/);
              for(const [file,field] of [["source.tar.gz","archive_sha256"],["runner.log","log_sha256"]]){
                const bytes=Buffer.from(bundle.files[file],"base64");
                assert.equal(createHash("sha256").update(bytes).digest("hex"),manifest[field]);
              }
              const phase=manifest.phases.find(p=>p.status==="fail")?.phase;
              assert.ok(phase);
              phases[phase]=(phases[phase]??0)+1;
              if(manifest.private_vitest_failure?.status==="captured"&&
                 manifest.private_vitest_failure.failures?.length>0)
                assertionPhases[phase]=(assertionPhases[phase]??0)+1;
            }
            assert.ok(phases.backend_tests>=1&&phases.frontend_tests>=1,
              "Both application test failure paths must retain recoverable evidence");
            assert.ok(assertionPhases.backend_tests>=1&&assertionPhases.frontend_tests>=1,
              "Native application failures must retain real Vitest assertion diagnostics");
            await writeFile("/tmp/functional-private-evidence-receipt.json",JSON.stringify({
              schema:"functional-private-evidence-roundtrip-v1",status:"PASS",
              recovered_bundles:recovered.bundles.length,failed_phase_counts:phases,
              private_assertion_phase_counts:assertionPhases,
              framework_sha:process.env.GITHUB_SHA,raw_evidence_uploaded:false
            },null,2)+"\n");
            await rm(directory,{recursive:true,force:true});
            await rm(output);
          '
      - name: Upload sanitized functional evidence - not model/runner logs
        uses: actions/upload-artifact@v4
        with:
          name: functional-signed-dag-account-suspension
          path: |
            /tmp/functional-evidence.json
            /tmp/functional-private-evidence-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Report strictly limited service status on failure
        if: failure()
        run: |
          echo "E2E failed; raw model and provider logs are intentionally not published."
          docker ps --format '{{.Names}} {{.Status}}' || true
      - name: Stop disposable services without deleting unrelated volumes
        if: always()
        run: |
          kill "$(cat /tmp/native-evm-gateway.pid)" 2>/dev/null || true
          kill "$(cat /tmp/native-evm-adapter.pid)" 2>/dev/null || true
          rm -f "${ADAPTER_ENGINEER_NATIVE_SOCKET:-}" 2>/dev/null || true
          if [[ -f poc/infra/.env ]]; then
            docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml down || true
          fi

