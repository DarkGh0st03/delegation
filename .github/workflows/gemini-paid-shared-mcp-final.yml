# Manual and potentially BILLED: refactor pilot with FOUR genuine Gemini models.
# Original authenticated Engineer service is NOT represented here.
# This pilot uses a clearly identified signed ENGINEER TEST fixture and may
# FAIL if Gemini proposes a DAG shape the existing acceptance harness rejects.
# The default-branch workflow of this same filename remains legacy; select
# refactor/post-prof-plan-contracts-20261021 explicitly in GitHub Actions.
name: Gemini Real - Refactor Signed DAG Account Suspension Pilot (Manual Only)
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'For a billed run type exactly I AUTHORIZE GEMINI API CHARGES'
        type: string
        required: true
      model:
        description: 'Model selected for Planning, Backend, Frontend, Test'
        type: string
        required: true
        default: 'gemini-3.8-flash'
      pinned_commit_sha:
        description: 'Paste the exact 40-character commit SHA verified by all three offline CIs'
        type: string
        required: true
      billing_cap_acknowledgement:
        description: 'Type exactly I VERIFIED PROJECT SPEND CAP AND UNDERSTAND POSSIBLE OVERAGES'
        type: string
        required: true
      repair_authorization:
        description: 'Optional extra billed recovery: type I AUTHORIZE ONE ADDITIONAL GEMINI REPAIR EPOCH, otherwise leave disabled'
        type: string
        required: true
        default: 'NO ADDITIONAL REPAIR AUTHORIZED'
      thinking_level:
        description: 'Fixed LOW thinking for this bounded pilot'
        type: choice
        required: true
        options: [LOW]
permissions:
  contents: read
  # Only the pre-model exact-SHA CI check needs the read-only Actions API.
  actions: read
concurrency:
  group: refactor-one-use-four-gemini-${{ github.ref }}
  cancel-in-progress: false
jobs:
  account-suspension:
    name: Four Gemini models - real signed DC VP Gitea Docker - TEST approval
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.repository == 'DarkGh0st03/delegation' && github.ref == 'refs/heads/refactor/post-prof-plan-contracts-20261021' && inputs.authorization == 'I AUTHORIZE GEMINI API CHARGES' && inputs.model == 'gemini-3.8-flash' && inputs.thinking_level == 'LOW' }}
    runs-on: ubuntu-latest
    # Accommodate independent bounded Planning and signed ADK/A2A Tasks.
    # GitHub still terminates the run; this is not a monetary spending cap.
    timeout-minutes: 120
    env:
      ADAPTER_TRUST_PROFILE: evm
      ADAPTER_CALLER_ENGINEER: local-native-engineer-ci
      ADAPTER_CALLER_GATEWAY: local-native-gateway-ci
      ADAPTER_CALLER_ORCHESTRATOR: local-native-orchestrator-ci
      ADAPTER_CALLER_BACKEND: local-native-backend-ci
      ADAPTER_CALLER_FRONTEND: local-native-frontend-ci
      ADAPTER_CALLER_TEST: local-native-test-ci
      ADAPTER_ID_GATEWAY: urn:thesis:service:gateway
      ADAPTER_BIND_ADDR: 127.0.0.1:8090
      GATEWAY_BIND_ADDR: 127.0.0.1:8080
      GATEWAY_VERIFIER_MODE: core-rust
      GATEWAY_PROVIDER_MODE: mock
      GATEWAY_AUDIENCE: cloud-access-gateway
      GATEWAY_REQUEST_TTL_MS: "120000"
      GATEWAY_RESOURCE_AUTHORITY: gitea.local
      GITEA_OWNER: thesis
      GITEA_REPOSITORY: iam-console-poc
      OPA_URL: http://127.0.0.1:8181
      OPA_TIMEOUT_MS: "2000"
      RPC_URL: http://127.0.0.1:8545
      CHAIN_ID: "31337"
      ADAPTER_PUBLIC_ARTIFACT_DIR: /tmp/delegation-native-public
      CORE_RUST_PUBLIC_ARTIFACT_DIR: /tmp/delegation-native-public
      CORE_RUST_RPC_URL: http://127.0.0.1:8545
      CORE_RUST_CHAIN_ID: "31337"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - name: Install pinned local Node and DID dependencies
        run: |
          npm --prefix poc ci --ignore-scripts --no-audit --no-fund
          npm --prefix blockchain/did-client ci --ignore-scripts --no-audit --no-fund
          node poc/scripts/init-local-env.mjs --force
      - name: Verify one-use manual charge consent and source identity (no Gemini call)
        env:
          DELEGATION_GEMINI_MODEL: ${{ inputs.model }}
          DELEGATION_GEMINI_CHARGE_CONFIRMATION: ${{ inputs.authorization }}
          DELEGATION_SIGNED_GEMINI_PILOT: "1"
          DELEGATION_PINNED_COMMIT_SHA: ${{ inputs.pinned_commit_sha }}
          DELEGATION_BILLING_CAP_ACK: ${{ inputs.billing_cap_acknowledgement }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/refactor/post-prof-plan-contracts-20261021
          node --test poc/scripts/test/signed-gemini-pilot-consent.test.mjs
          node --test poc/scripts/test/signed-gemini-pilot-usage.test.mjs
          node --test poc/scripts/test/signed-gemini-pilot-failure-observation.test.mjs
          node poc/scripts/signed-gemini-pilot-consent.mjs --preflight-no-inference
          echo "Pilot configuration checked without API access; pricing and input usage remain provider-dependent."
          node --check poc/apps/gateway/native-test/native-planning-read-core-evm-e2e.mjs
          node --check poc/apps/gateway/native-test/native-approved-planner-dag-positive.mjs
          node --check poc/apps/test-runner-controller/scripts/isolated-trusted-security-ci-positive-smoke.mjs
          node --experimental-strip-types --test poc/apps/gateway/native-test/approved-plan-agent-model-binding.test.mjs
      - name: Block billed Gemini pilot unless SAME SHA passed all three offline CI gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELEGATION_GEMINI_MODEL: ${{ inputs.model }}
          DELEGATION_GEMINI_CHARGE_CONFIRMATION: ${{ inputs.authorization }}
          DELEGATION_SIGNED_GEMINI_PILOT: "1"
          DELEGATION_PINNED_COMMIT_SHA: ${{ inputs.pinned_commit_sha }}
          DELEGATION_BILLING_CAP_ACK: ${{ inputs.billing_cap_acknowledgement }}
        run: |
          set -euo pipefail
          node --test poc/scripts/test/signed-gemini-pilot-ci-gate.test.mjs
          node poc/scripts/signed-gemini-pilot-ci-gate.mjs --check-ci-no-inference
      - name: Start only disposable Anvil and OPA
        run: |
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml up -d anvil opa
          for i in {1..90}; do
            if cast chain-id --rpc-url "$RPC_URL" >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:8181/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.5
          done
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml ps
          exit 1
      - name: Generate disposable public test identities
        run: |
          local_key() { printf '0x%064x' "$1"; }
          deployer_key="$(local_key 1)"
          deployer_address="$(cast wallet address --private-key "$deployer_key")"
          cast rpc --rpc-url "$RPC_URL" anvil_setBalance "$deployer_address" 0x56BC75E2D63100000 >/dev/null
          echo "ANVIL_DEPLOYER_PRIVATE_KEY=$deployer_key" >> "$GITHUB_ENV"
          echo "GOVERNANCE_PRIVATE_KEY=$deployer_key" >> "$GITHUB_ENV"
          for entry in ENGINEER:2 ORCHESTRATOR:3 BACKEND:4 FRONTEND:5 TEST:6; do
            role="${entry%%:*}"
            n="${entry##*:}"
            key="$(local_key "$n")"
            address="$(cast wallet address --private-key "$key")"
            cast rpc --rpc-url "$RPC_URL" anvil_setBalance "$address" 0x56BC75E2D63100000 >/dev/null
            echo "ADAPTER_EVM_PRIVATE_KEY_${role}=$key" >> "$GITHUB_ENV"
            echo "ADAPTER_ID_${role}=did:ethr:0x7a69:${address}" >> "$GITHUB_ENV"
          done
      - name: Deploy public DID and EVM trust registries
        run: |
          bash poc/scripts/bootstrap-trust.sh
          set -a
          source poc/infra/runtime/trust.env
          set +a
          for key in DID_REGISTRY_ADDRESS ENTERPRISE_TRUST_REGISTRY_ADDRESS ISSUER_REGISTRY_ADDRESS; do
            echo "$key=${!key}" >> "$GITHUB_ENV"
          done
          echo "CORE_RUST_DID_REGISTRY_ADDRESS=$DID_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_ENTERPRISE_REGISTRY_ADDRESS=$ENTERPRISE_TRUST_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_ISSUER_REGISTRY_ADDRESS=$ISSUER_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_DID_RESOLVER_SCRIPT=$GITHUB_WORKSPACE/blockchain/did-client/resolve-did-json.mjs" >> "$GITHUB_ENV"
      - name: Build signed-credential Adapter and native Core Rust addon
        run: |
          cargo build --manifest-path services/delegation-adapter/Cargo.toml --locked
          cargo build --release --manifest-path services/delegation-core-node/Cargo.toml
          mkdir -p poc/apps/gateway/src/native "$ADAPTER_PUBLIC_ARTIFACT_DIR"
          cp services/delegation-core-node/target/release/libdelegation_core_node.so poc/apps/gateway/src/native/delegation-core.node
      - name: Start Adapter with public-only shared verification artifacts
        run: |
          cargo run --manifest-path services/delegation-adapter/Cargo.toml --locked > /tmp/native-evm-adapter.log 2>&1 &
          echo $! > /tmp/native-evm-adapter.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/native-evm-adapter.log
          exit 1
      - name: Start Gateway using only the native Rust Core verifier
        run: |
          npm --prefix poc run gateway:start > /tmp/native-evm-gateway.log 2>&1 &
          echo $! > /tmp/native-evm-gateway.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/native-evm-gateway.log
          exit 1
      - name: Preload disposable Gitea, OPA and Docker acceptance images
        run: |
          docker pull docker.gitea.com/gitea:28.0.0
          docker pull node:22.15.0-bookworm
          docker pull openpolicyagent/opa:1.21.1
      - name: Verify configured Gemini key and model metadata (NO generation)
        env:
          GEMINI_API_KEY: ${{ secrets.Delegation_Thesis_Gemini }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo "Missing Gemini secret; no model call"; exit 1; }
          node poc/scripts/check-gemini-planner-model-access.mjs --check-model-access
      - name: ONE explicitly authorized real Gemini signed-DAG Account Suspension pilot
        env:
          GEMINI_API_KEY: ${{ secrets.Delegation_Thesis_Gemini }}
          DELEGATION_GEMINI_MODEL: ${{ inputs.model }}
          DELEGATION_GEMINI_CHARGE_CONFIRMATION: ${{ inputs.authorization }}
          DELEGATION_SIGNED_GEMINI_PILOT: "1"
          DELEGATION_PINNED_COMMIT_SHA: ${{ inputs.pinned_commit_sha }}
          DELEGATION_BILLING_CAP_ACK: ${{ inputs.billing_cap_acknowledgement }}
          DELEGATION_GEMINI_REPAIR_CHARGE_CONFIRMATION: ${{ inputs.repair_authorization }}
          DELEGATION_SIGNED_GEMINI_REPAIR_D1: ${{ inputs.repair_authorization == 'I AUTHORIZE ONE ADDITIONAL GEMINI REPAIR EPOCH' && '1' || '0' }}
          APPROVED_RUNNER_NATIVE_EVM: "1"
          APPROVED_RUNNER_THREE_AGENT_DAG: "1"
          APPROVED_RUNNER_HOST_SELECTED_ADK_MODELS: "1"
          APPROVED_RUNNER_SCENARIO: account-suspension
          GITEA_ADMIN_USER: isolated_admin
          GITEA_ADMIN_PASSWORD: local-gemini-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          GITEA_IMAGE: docker.gitea.com/gitea:28.0.0
          TEST_RUNNER_DOCKER_IMAGE: node:22.15.0-bookworm
          OPA_IMAGE: openpolicyagent/opa:1.21.1
        run: |
          set -euo pipefail
          test "$DELEGATION_GEMINI_CHARGE_CONFIRMATION" = 'I AUTHORIZE GEMINI API CHARGES'
          test "$DELEGATION_GEMINI_MODEL" = 'gemini-3.8-flash'
          test -n "${GEMINI_API_KEY:-}"
          node poc/scripts/signed-gemini-pilot-consent.mjs --require-key-no-inference
          # Never publish raw model prompts, source or credential-bearing logs.
          npm --prefix poc run security-ci:isolated-positive-smoke -w @thesis/test-runner-controller > /tmp/real-four-gemini-pilot.log 2>&1 || {
            # Never copy raw model/provider/GitHub/VP logs into artifacts.
            node --input-type=module -e '
              import {readFileSync,writeFileSync} from "node:fs";
              import {extractSafeGeminiPilotDockerEvidence}
                from "./poc/apps/test-runner-controller/scripts/gemini-pilot-safe-docker-evidence.mjs";
              import {extractSafeGeminiPilotUsage,
                extractSafeGeminiPilotAgentSummary}
                from "./poc/scripts/signed-gemini-pilot-usage.mjs";
              import {classifySafeGeminiPilotFailure}
                from "./poc/scripts/signed-gemini-pilot-failure-observation.mjs";
              let data="";
              try{data=readFileSync("/tmp/real-four-gemini-pilot.log","utf8");}catch{}
              const phases=["native_preliminary_planning_real_disposable_gitea",
                "native_dag_failure","controlled_denial","docker_phase_status"];
              const matching=phases.filter(x=>data.includes(x));
              const prefix="[trusted-positive-ci] native_dag_failure ";
              let diagnostic=null;
              for(const line of data.split(/\r?\n/).reverse()){
                const at=line.indexOf(prefix);
                if(at<0)continue;
                try{
                  const value=JSON.parse(line.slice(at+prefix.length));
                  const item=value.gemini_pilot_diagnostic;
                  if(item&&typeof item==="object"&&
                     ["setup","gemini_planning","gemini_plan_proposed",
                       "signed_test_review","activation_dc_vp",
                       "delegated_agents_gitea_docker","complete"]
                       .includes(item.stage)&&
                     Number.isSafeInteger(item.model_turns_started)){
                    const site=item.assertion_location;
                    const safePlanningReasons=[
                      "ungrounded_or_missing_output","invalid_json",
                      "invalid_proposal_shape","invalid_task_count",
                      "invalid_task_identity","unsupported_agent_role",
                      "unsupported_tool_for_role","unauthorized_existing_file",
                      "unauthorized_new_file","invalid_path",
                      "invalid_permission_path","missing_branch_task",
                      "missing_branch_dependency","conflicting_unordered_writes",
                      "duplicate_task_permission","incorrect_work_branch",
                      "invalid_dependencies","invalid_permissions",
                      "execution_dag_incompatible",
                       "contract_validation_other"
                    ];
                    const rejection=item.planning_rejection;
                    const planningRejection=rejection&&
                      ["grounding","json","contract"].includes(rejection.stage)&&
                      safePlanningReasons.includes(rejection.reason)
                        ?{stage:rejection.stage,reason:rejection.reason}:null;
                    const taskCounts=item.approved_task_counts;
                    const roles=["orchestrator","backend","frontend","test"];
                    const safeCounts=taskCounts&&
                      typeof taskCounts==="object"&&!Array.isArray(taskCounts)&&
                      Object.keys(taskCounts).length===roles.length&&
                      roles.every(role=>Number.isSafeInteger(taskCounts[role])&&
                        taskCounts[role]>=0&&taskCounts[role]<=12)&&
                      roles.reduce((sum,role)=>sum+taskCounts[role],0)<=12;
                    diagnostic={
                      stage:item.stage,
                      category:item.category,
                      ...(safeCounts?{approved_task_counts:Object.fromEntries(
                        roles.map(role=>[role,taskCounts[role]])
                      )}:{}),
                      model_failure:item.model_failure,
                      model_turns_started:item.model_turns_started,
                      ...(["not_started","model_binding","dag_preflight","baseline_reads","agent_bootstrap","dispatcher_setup","a2a_dispatch","result_verification"].includes(item.delegated_phase)
                        ?{delegated_phase:item.delegated_phase}:{}),
                      ...(["none","a2a_task_not_completed","a2a_artifact_invalid","controlled_tool_failure","no_confirmed_revision","a2a_dispatch_failed","orchestrator_task_failed","root_revocation_unconfirmed","dependency_denied","adk_model_failure","a2a_result_mismatch","attestation_effect_race","approved_plan_denied","test_assertion","unclassified"].includes(item.delegated_failure)
                        ?{delegated_failure:item.delegated_failure}:{}),
                      ...(planningRejection
                        ?{planning_rejection:planningRejection}:{}),
                      ...(site&&
                        ["signed_dag_harness","planning_harness"].includes(site.module)&&
                        Number.isSafeInteger(site.line)&&
                        site.line>0&&site.line<2000
                        ?{assertion_location:{module:site.module,line:site.line}}:{})
                    };
                    break;
                  }
                }catch{}
              }
              const dockerEvidence=extractSafeGeminiPilotDockerEvidence(data);
              const failureObservation=classifySafeGeminiPilotFailure({
                docker_phase_evidence:dockerEvidence,
                gemini_pilot_diagnostic:diagnostic
              });
              writeFileSync("/tmp/four-gemini-pilot-failure.json",
                JSON.stringify({status:"FAIL",
                  failure_observation:failureObservation,
                  ...(diagnostic?{gemini_pilot_diagnostic:diagnostic}:{}),
                  // The native wrapper already redacts all other child data.
                  // Report only fixed phase/status enums; no raw model logs.
                  ...(dockerEvidence
                    ?{docker_phase_evidence:dockerEvidence}:{}),
                  framework_sha:process.env.GITHUB_SHA,
                  run_id:process.env.GITHUB_RUN_ID,
                  model_usage:extractSafeGeminiPilotUsage(data),
                  agent_failure_evidence:extractSafeGeminiPilotAgentSummary(data),
                  verified_signals:matching,
                  stage:"gemini_planning_or_delegated_execution",
                  root_revocation:"not_confirmed_by_this_report",
                  provider_invoice_cost:"unknown_check_provider_console",
                  human_approval:false},null,2)+"\n",{flag:"wx",mode:0o600});
            '
            echo "::error::Gemini signed-DAG pilot failed; sanitized failure artifact only."
            exit 1
          }
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            import {extractSafeGeminiPilotUsage}
              from "./poc/scripts/signed-gemini-pilot-usage.mjs";
            const privateLog=readFileSync("/tmp/real-four-gemini-pilot.log","utf8");
            const lines=privateLog.split(/\r?\n/);
            const events=lines.map(x=>{try{return JSON.parse(x);}catch{return null;}})
              .filter(x=>x?.event==="gemini_signed_dag_pilot");
            if(events.length!==1||events[0].status!=="PASS"||
               events[0].four_real_models!==true||
               events[0].approval!=="signed_test_fixture_not_human"||
               events[0].docker_acceptance!=="pass"||
               events[0].merged!==false)process.exit(1);
            const usage=extractSafeGeminiPilotUsage(privateLog);
            if(usage.observation_integrity!=="valid"||
               ["planner","backend","frontend","test"].some(role=>
                 usage.role_usage[role].observed_delegate_calls<1))
              process.exit(1);
            const receipt={...events[0],
              model_usage:usage,
              framework_sha:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,
              billing_cost:"not_measured_check_provider_console",
              genuine_human_approval:false,r5_demo_pass:false};
            writeFileSync("/tmp/four-gemini-signed-pilot.json",
              JSON.stringify(receipt,null,2)+"\n",{flag:"wx",mode:0o600});
          '
      - name: Upload only sanitized pilot success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-gemini-signed-account-suspension-${{ github.run_id }}
          path: |
            /tmp/four-gemini-signed-pilot.json
            /tmp/four-gemini-pilot-failure.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report strictly limited service status on failure
        if: failure()
        run: |
          echo "E2E failed; raw model and provider logs are intentionally not published."
          docker ps --format '{{.Names}} {{.Status}}' || true
      - name: Stop disposable services without deleting unrelated volumes
        if: always()
        run: |
          kill "$(cat /tmp/native-evm-gateway.pid)" 2>/dev/null || true
          kill "$(cat /tmp/native-evm-adapter.pid)" 2>/dev/null || true
          if [[ -f poc/infra/.env ]]; then
            docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml down || true
          fi

