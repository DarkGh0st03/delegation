name: Gemini Structured Error One-Shot

# Explicitly user-approved single live request. No ordinary push can trigger it.
on:
  push:
    branches: [refactor/adk-integration]
    paths:
      - '.github/gemini-structured-error-once.trigger'

permissions:
  contents: read

concurrency:
  group: gemini-structured-error-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-content-once:
    if: ${{ contains(github.event.head_commit.message, 'Gemini structured-error one-shot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GEMINI_API_KEY: ${{ secrets.Delegation_Thesis_Gemini }}
      GEMINI_MODEL: gemini-3.8-flash
      GOOGLE_GENAI_USE_VERTEXAI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Require marker and existing Free Tier Gemini secret
        run: |
          test -f .github/gemini-structured-error-once.trigger
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Existing Gemini API secret missing' >&2
            exit 1
          fi
      - name: One synthetic generateContent with allowlisted Google error diagnostics
        run: node --experimental-strip-types poc/packages/agent-runtime/scripts/gemini-api-health-smoke.mjs
