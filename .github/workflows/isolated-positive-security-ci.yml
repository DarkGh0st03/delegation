# R397/R398: the historical positive job also proves on one real disposable
# Gitea PR/HEAD that Security CI status and protected Human Gate read-only
# use distinct actors. That PR is a fixture, NOT the native Rust-generated PR.
# Never perform merge, production GitHub review or paid inference. No Gemini/OpenAI keys are present.
# R385.17: this positive, disposable, zero-AI Security CI follows the
