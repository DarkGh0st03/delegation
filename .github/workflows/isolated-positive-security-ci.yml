name: Isolated Real Positive Security CI (No AI Billing)

# Dedicated disposable integration verification of the trusted Docker Runner
# and independent researcher acceptance.
# R397/R398: the historical positive job also proves on one real disposable
# Gitea PR/HEAD that Security CI status and protected Human Gate read-only
# use distinct actors. That PR is a fixture, NOT the native Rust-generated PR.
# Never perform merge, production GitHub review or paid inference. No Gemini/OpenAI keys are present.
# R385.17: this positive, disposable, zero-AI Security CI follows the
# authority-only feature branch (not the retired shared-MCP spike), for
# relevant runner/acceptance changes or explicit manual dispatch.
# Never touches persistent local Gitea or invokes a protected merge.
on:
  push:
    branches: [refactor/post-prof-plan-contracts-20261021]
    paths:
      - '.github/workflows/isolated-positive-security-ci.yml'
      - '.github/workflows/r38513-native-strict-full-recovery.yml'
      # R400: native PR, exact-SHA read-only Gate or its original E2E
      # must automatically exercise the REAL native Security CI path.
      - 'poc/packages/orchestrator-runtime/src/merge-readiness.ts'
      - 'poc/packages/orchestrator-runtime/test/native-gitea-ci-human-gate-fixture.mjs'
      - 'poc/packages/orchestrator-runtime/test/r375-native-protected-main-functional-draft-pr-e2e.mjs'
      - 'poc/apps/test-runner-controller/scripts/isolated-trusted-security-ci-positive-smoke.mjs'
      - 'poc/apps/test-runner-controller/fixtures/account-suspension-reference.mjs'
      # R410: source-level Owner/DAG/legacy migration changes must automatically
      # invoke no-AI native Rust+MCP+OPA+Docker Security CI on the same SHA.
      - 'poc/apps/test-runner-controller/scripts/approved-gateway-runner-session.mjs'
      - 'poc/packages/orchestrator-runtime/src/trusted-owner-reviewed-dag-execution.ts'
      - 'poc/packages/orchestrator-runtime/src/trusted-owner-operational-repair-handoff.ts'
      - 'poc/packages/orchestrator-runtime/src/trusted-owner-repair-planning-core.ts'
      - 'poc/packages/orchestrator-runtime/src/trusted-owner-repair-dag-execution.ts'
      # R411: native EVM fixture must never silently regress onto a legacy shim.
      - 'poc/apps/gateway/src/trusted-operational-feature-head.ts'
      - 'poc/apps/gateway/native-test/native-planning-read-core-evm-e2e.mjs'
      - 'poc/scripts/test/r411-legacy-compatibility.test.mjs'
      - 'poc/scripts/test/r408-reviewed-dag-caller-migration.test.mjs'
      - 'poc/scripts/r38517-canonical-route-closure.mjs'
      # R412: historical Engineer issuer dynamic-only import boundary.
      - 'poc/packages/orchestrator-runtime/src/trusted-engineer-legacy-mcp-http-port.ts'
      - 'poc/scripts/test/r412-engineer-http-lazy-loading.test.mjs'
      - 'poc/scripts/r3854-legacy-dag-closure-audit.mjs'
      - 'poc/scripts/test/r409-owner-repair-core-migration.test.mjs'
      - 'poc/apps/test-runner-controller/src/**'
      - 'poc/runner/acceptance/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-positive-security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R385.18: the historical HTTP Runner positive smoke is still preserved
  # below, but can no longer be mistaken for native Rust/Child/VP coverage.
  # This reusable workflow runs the full original Engineer/OPA/Gitea/
  # task-local MCP/A2A/Docker FAIL->PASS/independent Draft PR regression
  # on the SAME calling workflow SHA. It has no billable AI or merge path.
  authority-only-native-rust-positive:
    name: Canonical native Rust + private MCP + Docker FAIL to PASS (No AI)
    uses: ./.github/workflows/r38513-native-strict-full-recovery.yml
    permissions:
      contents: read

  real-positive-exact-sha:
    name: Disposable Gitea + Real Docker + CI/Human Gate same-PR readiness
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout trusted thesis framework without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: poc/package-lock.json

      - name: Install local PoC dependencies
        run: npm --prefix poc ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact Rust/Child/VP reusable route and historical caller fence (no AI)
        # Read-only parsed import and workflow inspection; never starts
        # an Adapter, source editor, Gemini, merge executor or Runner.
        run: |
          node --experimental-vm-modules poc/scripts/r38517-canonical-route-closure.mjs
          node --experimental-vm-modules --test poc/scripts/test/r38517-canonical-route-closure.test.mjs
          node --experimental-vm-modules --experimental-strip-types --test poc/scripts/test/r412-engineer-http-lazy-loading.test.mjs

      - name: R410 Owner-only recovery source and fail-closed audit gates
        run: |
          # Source-only tests: do not sign roots, invoke Gemini, or run A2A.
          node --experimental-vm-modules --experimental-strip-types --test poc/scripts/test/r409-owner-repair-core-migration.test.mjs
          node --test poc/scripts/test/r3853-owner-recovery-lazy-controller.test.mjs
          node --experimental-vm-modules --experimental-strip-types --test poc/scripts/test/r411-legacy-compatibility.test.mjs
          node --check poc/apps/gateway/native-test/native-planning-read-core-evm-e2e.mjs
          node --experimental-vm-modules --experimental-strip-types --test poc/scripts/test/r406-neutral-repair-model-contract.test.mjs

      - name: Preload disposable service and Runner Docker images
        run: |
          docker pull docker.gitea.com/gitea:28.0.0
          docker pull openpolicyagent/opa:1.21.1
          docker pull node:22.15.0-bookworm

      - name: Run real positive acceptance with no external model
        env:
          GITEA_ADMIN_USER: isolated_admin
          GITEA_ADMIN_PASSWORD: local-ci-fixture-only-${{ github.run_id }}-${{ github.run_attempt }}
          GITEA_IMAGE: docker.gitea.com/gitea:28.0.0
          TEST_RUNNER_DOCKER_IMAGE: node:22.15.0-bookworm
          # R397: same disposable REAL Gitea feature PR / original CI status,
          # distinct fixture reviewer and read-only merge-readiness gate.
          # This performs NO merge or paid inference.
          APPROVED_RUNNER_REAL_GITEA_HUMAN_GATE: "1"
        run: npm --prefix poc run security-ci:isolated-positive-smoke -w @thesis/test-runner-controller

      - name: Report any temporary containers after failure
        if: failure()
        run: |
          docker ps -a --filter 'name=delegation-ci-positive-' --format '{{.Names}} {{.Status}}'
          docker ps -a --filter 'name=delegation-runner-' --format '{{.Names}} {{.Status}}'
