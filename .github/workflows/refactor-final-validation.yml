name: Refactor Final Core Validation

on:
  push:
    branches:
      - refactor/core-cleanup
    paths:
      - .github/workflows/refactor-final-validation.yml

permissions:
  contents: read

jobs:
  final-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Core formatting
        run: cargo fmt --check

      - name: Core tests
        run: cargo test

      - name: Parallel verification tests
        run: cargo test --features parallel_verification

      - name: All feature tests
        run: cargo test --all-features

      - name: Compile examples
        run: cargo check --examples

      - name: Solidity tests
        run: forge test --root blockchain

      - name: Adapter formatting
        run: cargo fmt --manifest-path services/delegation-adapter/Cargo.toml --check

      - name: Adapter tests
        run: cargo test --manifest-path services/delegation-adapter/Cargo.toml
