# R233: REAL native Rust issuance + EVM trust + public-only Gateway verifier.
# No old Adapter HTTP executable, remote MCP or paid model calls.
# Unsigned initial branch is absent; protected unsolved main is unchanged.
# Protected-main Account Suspension with an authenticated specialist stop
# before the first write, followed by a replacement specialist Task.
# One genuinely failed Test remains incomplete; PR permitted only on independently attested Docker PASS.
name: R385.8 Native Strict Signed Post-FAIL Read and First Repair (No AI)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r3858-native-strict-read-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct-rust-live-evm:
    name: "Original Engineer -> real Docker FAIL -> signed post-fail read via Rust MCP -> first guarded CAS; no false PASS/PR"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ENGINEER_CORE_NATIVE_MODE: "1"
      R233_NATIVE_EVM: "1"
      APPROVED_RUNNER_NATIVE_MCP: "1"
      R3858_NATIVE_STRICT_POSTFAIL_PROBE: "1"
      R3818_CANONICAL_NATIVE_MCP: "1"
      ADAPTER_TRUST_PROFILE: evm
      ADAPTER_CALLER_ENGINEER: r233-engineer-local
      ADAPTER_CALLER_GATEWAY: r233-gateway-local
      ADAPTER_CALLER_ORCHESTRATOR: r233-orchestrator-local
      ADAPTER_CALLER_BACKEND: r233-backend-local
      ADAPTER_CALLER_FRONTEND: r233-frontend-local
      ADAPTER_CALLER_TEST: r233-test-local
      ADAPTER_ID_GATEWAY: urn:thesis:service:gateway
      GATEWAY_VERIFIER_MODE: core-rust
      RPC_URL: http://127.0.0.1:8545
      CHAIN_ID: "31337"
      ADAPTER_PUBLIC_ARTIFACT_DIR: /tmp/delegation-engineer-r233-public
      CORE_RUST_PUBLIC_ARTIFACT_DIR: /tmp/delegation-engineer-r233-public
      CORE_RUST_RPC_URL: http://127.0.0.1:8545
      CORE_RUST_CHAIN_ID: "31337"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - name: Refuse paid model and competing Adapter startup
        run: |
          test -z "${GEMINI_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          test "${DELEGATION_SIGNED_GEMINI_PILOT:-0}" != 1
          test ! -e /tmp/native-evm-adapter.pid
      - name: Install pinned DID/PoC dependencies; create disposable local env
        run: |
          npm --prefix poc ci --ignore-scripts --no-audit --no-fund
          npm --prefix blockchain/did-client ci --ignore-scripts --no-audit --no-fund
          node poc/scripts/init-local-env.mjs --force
      - name: Preflight free R371 root Branch-before-SDK operational launcher
        run: |
          node --check poc/packages/orchestrator-runtime/test/r375-native-protected-main-functional-draft-pr-e2e.mjs
          node --check poc/packages/orchestrator-runtime/src/trusted-authority-only-adaptive-work-loop.mjs
          node --experimental-strip-types --test poc/packages/orchestrator-runtime/test/trusted-authority-only-adaptive-work-loop.test.mjs
          node --test poc/apps/orchestrator/test/trusted-authority-only-operational-launcher.test.mjs
      - name: Boot only disposable Anvil and OPA (no Adapter or Gateway HTTP service)
        run: |
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml up -d anvil opa gitea
          for i in {1..90}; do
            if cast chain-id --rpc-url "$RPC_URL" >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:8181/health >/dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml ps
          exit 1
      - name: Bootstrap disposable real Gitea
        run: bash poc/scripts/bootstrap-gitea.sh
      - name: Fund disposable Engineer, Orchestrator and agent signing keys
        run: |
          local_key() { printf '0x%064x' "$1"; }
          deployer_key="$(local_key 1)"
          deployer_address="$(cast wallet address --private-key "$deployer_key")"
          cast rpc --rpc-url "$RPC_URL" anvil_setBalance "$deployer_address" 0x56BC75E2D63100000 >/dev/null
          echo "ANVIL_DEPLOYER_PRIVATE_KEY=$deployer_key" >> "$GITHUB_ENV"
          echo "GOVERNANCE_PRIVATE_KEY=$deployer_key" >> "$GITHUB_ENV"
          for entry in ENGINEER:2 ORCHESTRATOR:3 BACKEND:4 FRONTEND:5 TEST:6; do
            role="${entry%%:*}"
            n="${entry##*:}"
            key="$(local_key "$n")"
            address="$(cast wallet address --private-key "$key")"
            cast rpc --rpc-url "$RPC_URL" anvil_setBalance "$address" 0x56BC75E2D63100000 >/dev/null
            echo "ADAPTER_EVM_PRIVATE_KEY_${role}=$key" >> "$GITHUB_ENV"
            echo "ADAPTER_ID_${role}=did:ethr:0x7a69:${address}" >> "$GITHUB_ENV"
          done
      - name: Deploy real public DID/trust/issuer EVM registries
        run: |
          bash poc/scripts/bootstrap-trust.sh
          set -a
          source poc/infra/runtime/trust.env
          set +a
          for key in DID_REGISTRY_ADDRESS ENTERPRISE_TRUST_REGISTRY_ADDRESS ISSUER_REGISTRY_ADDRESS; do
            echo "$key=${!key}" >> "$GITHUB_ENV"
          done
          echo "CORE_RUST_DID_REGISTRY_ADDRESS=$DID_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_ENTERPRISE_REGISTRY_ADDRESS=$ENTERPRISE_TRUST_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_ISSUER_REGISTRY_ADDRESS=$ISSUER_REGISTRY_ADDRESS" >> "$GITHUB_ENV"
          echo "CORE_RUST_DID_RESOLVER_SCRIPT=$GITHUB_WORKSPACE/blockchain/did-client/resolve-did-json.mjs" >> "$GITHUB_ENV"
      # Cache compiled Rust dependencies/builds separately from executable
      # assertions. A failing E2E must still retain a verified preceding
      # native build cache; never cache local keys, runtime env or Gitea.
      - name: Restore verified R364-compatible native Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/delegation-engineer-node/target
            services/delegation-core-node/target
            services/delegation-adapter/target
          key: r364-rust99-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'services/delegation-adapter/Cargo.lock', 'services/**/Cargo.toml') }}
      - name: Build Engineer direct owner + independent public-only Gateway native addons
        run: |
          cargo test --manifest-path services/delegation-engineer-node/Cargo.toml --lib
          cargo build --release --manifest-path services/delegation-engineer-node/Cargo.toml
          cargo build --release --manifest-path services/delegation-core-node/Cargo.toml
          mkdir -p poc/packages/orchestrator-runtime/src/native poc/apps/gateway/src/native "$ADAPTER_PUBLIC_ARTIFACT_DIR"
          cp services/delegation-engineer-node/target/release/libdelegation_engineer_node.so poc/packages/orchestrator-runtime/src/native/delegation-engineer.node
          cp services/delegation-core-node/target/release/libdelegation_core_node.so poc/apps/gateway/src/native/delegation-core.node
          echo "ADAPTER_ENGINEER_NATIVE_SOCKET=$RUNNER_TEMP/r233-engineer-$GITHUB_RUN_ID.sock" >> "$GITHUB_ENV"
      - name: Save verified native Rust build cache before E2E
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/delegation-engineer-node/target
            services/delegation-core-node/target
            services/delegation-adapter/target
          key: r364-rust99-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'services/delegation-adapter/Cargo.lock', 'services/**/Cargo.toml') }}
      - name: Assert legacy Adapter executable refuses duplicate issuer in direct mode
        run: |
          # This command must reject BEFORE EVM signing keys or an HTTP server
          # are initialized. A build failure is not accepted as a pass.
          if cargo run --quiet --manifest-path services/delegation-adapter/Cargo.toml --features legacy-http >/tmp/r233-retired-adapter-guard.log 2>&1; then
            echo "Forbidden: legacy Adapter accepted native Engineer mode" >&2
            exit 1
          fi
          grep -q 'Legacy Adapter HTTP cannot start with direct Engineer Core enabled' /tmp/r233-retired-adapter-guard.log
      - name: Assert NO old Adapter HTTP listener is running before direct Rust owner starts
        run: |
          test ! -e "$ADAPTER_ENGINEER_NATIVE_SOCKET"
          if curl -fsS --connect-timeout 1 http://127.0.0.1:8090/health >/dev/null 2>&1; then
            echo "Forbidden: Adapter HTTP service running" >&2
            exit 1
          fi
          test ! -e /tmp/native-evm-adapter.pid
      - name: Native owner signed post-FAIL diagnostic read and first guarded CAS (stop before PR)
        # This mode belongs to the original private owner STEP only, never
        # to the legacy Adapter process checked above. Prevent downgrade.
        env:
          DELEGATION_GATEWAY_ARCHITECTURE: authority-only
        run: |
          set -euo pipefail
          test "$R3818_CANONICAL_NATIVE_MCP" = "1"
          test "${DELEGATION_GATEWAY_ARCHITECTURE:-}" = "authority-only"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          set -a
          source poc/infra/runtime/gateway.env
          source poc/infra/runtime/runner.env
          set +a
          test "${DELEGATION_GATEWAY_ARCHITECTURE:-}" = "authority-only"
          test "${R3818_CANONICAL_NATIVE_MCP:-}" = "1"
          test "${APPROVED_RUNNER_NATIVE_MCP:-}" = "1"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          node --check poc/packages/orchestrator-runtime/test/r375-native-protected-main-functional-draft-pr-e2e.mjs
          node --experimental-strip-types poc/packages/orchestrator-runtime/test/r375-native-protected-main-functional-draft-pr-e2e.mjs | tee "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"event":"canonical_signed_handoff_native"' "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"event":"r3858_strict_native_postfail_read_and_first_repair_no_false_pass"' "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"first_docker_status":"fail"' "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"signed_read_only_diagnostic_tasks":1' "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"gateway_cas_writes":3' "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"further_tests_proven_pass":false' "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"pr_created":false' "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"original_root_retired":true' "$RUNNER_TEMP/r3858-proof.jsonl"
          grep -Fq '"paid_model_calls":0' "$RUNNER_TEMP/r3858-proof.jsonl"
      - name: Validate native Gateway root read and no HTTP downgrade (no model calls)
        run: node --experimental-strip-types --test poc/apps/gateway/test/trusted-gateway-native-root-ipc.test.ts
      - name: Dispose Anvil and private local socket only
        if: always()
        run: |
          rm -f "${ADAPTER_ENGINEER_NATIVE_SOCKET:-}" 2>/dev/null || true
          if [[ -f poc/infra/.env ]]; then
            docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml down || true
          fi
