name: ADK Phase 2 Dependency Bootstrap

on:
  push:
    branches: [refactor/adk-integration]
    paths:
      - 'poc/packages/agent-runtime/package.json'
      - 'poc/packages/agent-runtime/src/adk-specialized-agents.ts'
      - 'poc/packages/agent-runtime/test/adk-specialized-agents.test.ts'
      - '.github/workflows/adk-phase2-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: phase2-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Regenerate only PoC root lockfile, keeping existing pinned dependencies
        run: npm --prefix poc install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact workspace dependency tree
        run: npm --prefix poc ci --ignore-scripts --no-audit --no-fund
      - name: Run existing and new agent runtime tests
        run: npm --prefix poc run agent-runtime:test
      - name: Run orchestrator regression
        run: npm --prefix poc run orchestrator-runtime:test
      - name: Commit lockfile only if tests pass
        run: |
          if ! git diff --quiet -- poc/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add poc/package-lock.json
            git commit -m "build(adk): pin ADK agent-runtime dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
