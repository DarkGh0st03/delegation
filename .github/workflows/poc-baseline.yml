          export OPA_URL=http://127.0.0.1:8181
          npm --prefix poc run gateway:start > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

      - name: Run real Verifier-OPA-Gitea create-branch smoke
        run: node poc/scripts/phase5b1-smoke.mjs

      - name: Verify policy-denied branch was not created
        run: |
          set -a
          source poc/infra/.env
          set +a
          base_url="http://127.0.0.1:${GITEA_HOST_PORT:-3000}"
          status="$(curl -sS -o /tmp/phase5b1-denied.json -w '%{http_code}' \
            -u "$GITEA_ADMIN_USER:$GITEA_ADMIN_PASSWORD" \
            "$base_url/api/v1/repos/$GITEA_ORG/$GITEA_REPOSITORY/branches/feature%2Fnot-allowed")"
          if [[ "$status" != "404" ]]; then
            echo "Policy-denied branch lookup returned HTTP $status" >&2
            cat /tmp/phase5b1-denied.json >&2 || true
            exit 1
          fi

      - name: Show Phase 5B.1 logs on failure
        if: failure()
        run: |
          echo "=== Adapter ==="
          cat /tmp/adapter.log || true
          echo "=== Gateway ==="
          cat /tmp/gateway.log || true
