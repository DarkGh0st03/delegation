name: PoC Baseline Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust regression tests
        run: cargo test

      - name: PoC scaffold sanity check
        run: npm --prefix poc run check:scaffold
