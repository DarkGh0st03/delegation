# All checks here are free/offline. Dedicated Docker E2E is a separate workflow.
name: Current Delegation PoC Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-poc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: poc/package-lock.json
      # R435.1: GitHub's release-asset CDN returned repeated 504 for both
      # unversioned foundryup and the versioned tarball. Prefer the official
      # versioned GHCR image; extract only three binaries into RUNNER_TEMP.
      # Require GitHub's publisher-signed OCI attestation for GHCR; the
      # fallback remains the official pinned v1.8.4 release with the
      # SHA-256 recorded in the GitHub release API. No latest or paid AI.
      - name: Install verified Foundry v1.8.4 (signed GHCR or SHA-256 release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = "Linux-x86_64"
          bin="$RUNNER_TEMP/r4351-foundry-v1.8.4/bin"
          mkdir -p "$bin"
          image='ghcr.io/foundry-rs/foundry:v1.8.4'
          if docker pull --platform linux/amd64 "$image" &&
             gh attestation verify "oci://$image" --repo foundry-rs/foundry; then
            # A matching versioned tag is insufficient: verify the
            # publisher's signed OCI build attestation before extraction.
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$image" | grep -F 'ghcr.io/foundry-rs/foundry@sha256:'
            cid="$(docker create --platform linux/amd64 --entrypoint /bin/true "$image")"
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
            for tool in forge cast anvil; do
              docker cp "$cid:/usr/local/bin/$tool" "$bin/$tool"
            done
            docker rm -f "$cid" >/dev/null
            trap - EXIT
          else
            # Fail closed if GHCR is unavailable AND the exact-release
            # archive cannot be downloaded and verified. No substitutions.
            archive="$RUNNER_TEMP/foundry_v1.8.4_linux_amd64.tar.gz"
            curl --proto '=https' --tlsv1.2 --fail --location --show-error \
              --retry 6 --retry-all-errors --retry-delay 3 \
              --connect-timeout 20 --max-time 240 \
              --output "$archive" \
              'https://github.com/foundry-rs/foundry/releases/download/v1.8.4/foundry_v1.8.4_linux_amd64.tar.gz'
            printf '%s  %s\n' \
              '699e2207a6a9b27ca17c48c81e56f1677ed9c58b623b59128b4e15ec9da0625e' \
              "$archive" | sha256sum --check --status
            test "$(stat -c '%s' "$archive")" -eq 117721507
            tar -xzf "$archive" -C "$bin" --no-same-owner
          fi
          for tool in forge cast anvil; do
            test -x "$bin/$tool"
            "$bin/$tool" --version | grep -F '1.8.4'
          done
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          npm --prefix poc ci --ignore-scripts --no-audit --no-fund
          npm --prefix poc/mcp-shared ci --ignore-scripts --no-audit --no-fund
      - name: Rust core, adapter and EVM contract regressions
        run: |
          cargo fmt --check
          cargo test --locked --all-features
          cargo fmt --manifest-path services/delegation-adapter/Cargo.toml --check
          cargo test --manifest-path services/delegation-adapter/Cargo.toml --locked --features legacy-http
          forge test --root blockchain
      - name: Node integration, MCP and security contracts
        run: |
          npm --prefix poc run check:scaffold
          npm --prefix poc run check:imports
          npm --prefix poc run gateway:test
          npm --prefix poc run agent-runtime:test
          npm --prefix poc run orchestrator-runtime:test
          npm --prefix poc run test -w @thesis/test-runner-controller
          npm --prefix poc run test -w @thesis/a2a-agent
          npm --prefix poc/mcp-shared test
          node --experimental-vm-modules --experimental-strip-types --test poc/scripts/test/*.test.mjs
          node --experimental-strip-types --test poc/packages/orchestrator-runtime/test/trusted-engineer-authority.test.ts
      - name: OPA policy regression
        run: bash poc/scripts/phase4a-policy-test.sh
      - name: Verify canonical signed Gemini manual guard without running Gemini
        run: |
          node --check poc/scripts/signed-gemini-pilot-consent.mjs
          node --check poc/scripts/signed-gemini-pilot-ci-gate.mjs
