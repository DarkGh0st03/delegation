# All checks here are free/offline. Dedicated Docker E2E is a separate workflow.
name: Current Delegation PoC Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-poc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - name: Install dependencies
        run: |
          npm --prefix poc ci --ignore-scripts --no-audit --no-fund
          npm --prefix poc/mcp-shared ci --ignore-scripts --no-audit --no-fund
      - name: Rust core, adapter and EVM contract regressions
        run: |
          cargo fmt --check
          cargo test --locked --all-features
          cargo fmt --manifest-path services/delegation-adapter/Cargo.toml --check
          cargo test --manifest-path services/delegation-adapter/Cargo.toml
          forge test --root blockchain
      - name: Node integration, MCP and security contracts
        run: |
          npm --prefix poc run check:scaffold
          npm --prefix poc run check:imports
          npm --prefix poc run gateway:test
          npm --prefix poc run agent-runtime:test
          npm --prefix poc run orchestrator-runtime:test
          npm --prefix poc run test -w @thesis/test-runner-controller
          npm --prefix poc run test -w @thesis/a2a-agent
          npm --prefix poc/mcp-shared test
          node --experimental-vm-modules --experimental-strip-types --test poc/scripts/test/*.test.mjs
          node --experimental-strip-types poc/packages/orchestrator-runtime/scripts/check-account-suspension-reference-scope.mjs
      - name: OPA policy regression
        run: bash poc/scripts/phase4a-policy-test.sh
      - name: Verify live Gemini entrypoint syntax without running Gemini
        run: node --check poc/packages/agent-runtime/scripts/a2a-production-coordinator-mcp-gemini-live.mjs
