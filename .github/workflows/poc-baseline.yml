            if curl -fsS http://127.0.0.1:8095/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/test-runner.log
          exit 1

      - name: Start Gateway with Gitea and Runner
        run: |
          set -a
          source poc/infra/runtime/gateway.env
          set +a
          export GITEA_BASE_URL="$GITEA_HOST_BASE_URL"
          export DELEGATION_ADAPTER_URL=http://127.0.0.1:8090
          export OPA_URL=http://127.0.0.1:8181
          export TEST_RUNNER_URL=http://127.0.0.1:8095
          npm --prefix poc run gateway:start > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

      - name: Run authorized Gateway-Verifier-OPA-Runner smoke
        run: node poc/scripts/phase6b-gateway-smoke.mjs

      - name: Verify execution container was destroyed
        run: |
          remaining="$(docker ps -a --filter 'name=delegation-runner-' --format '{{.Names}}')"
          if [[ -n "$remaining" ]]; then
            echo "Runner left execution containers behind:" >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi

      - name: Show Phase 6B Gateway logs on failure
        if: failure()
        run: |
          echo "=== Adapter ==="
          cat /tmp/adapter.log || true
          echo "=== Gateway ==="
          cat /tmp/gateway.log || true
          echo "=== Test Runner ==="
          cat /tmp/test-runner.log || true
          echo "=== Runner execution logs ==="
          if [[ -d /tmp/delegation-runner-logs ]]; then
            find /tmp/delegation-runner-logs -maxdepth 1 -type f -print -exec cat {} \;
          fi
          echo "=== Gitea ==="
          docker logs delegation-poc-gitea || true
          echo "=== OPA ==="
          docker logs delegation-poc-opa || true
          echo "=== Residual execution containers ==="
          docker ps -a --filter 'name=delegation-runner-' || true

      - name: Stop Phase 6B Gateway services
        if: always()
        run: |
          kill "$(cat /tmp/gateway.pid)" 2>/dev/null || true
          kill "$(cat /tmp/test-runner.pid)" 2>/dev/null || true
          kill "$(cat /tmp/adapter.pid)" 2>/dev/null || true
          docker ps -aq --filter 'name=delegation-runner-' | xargs -r docker rm -f
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml down -v

