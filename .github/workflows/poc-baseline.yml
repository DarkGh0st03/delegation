  phase6b-isolated-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_RUNNER_GATEWAY_TOKEN: phase6b-gateway-runner-secret
      TEST_RUNNER_BIND_ADDR: 127.0.0.1:8095
      TEST_RUNNER_URL: http://127.0.0.1:8095
      TEST_RUNNER_DOCKER_IMAGE: node:22.15.0-bookworm
      TEST_RUNNER_PHASE_TIMEOUT_MS: "600000"
      EXPECTED_GITEA_REVISION: ea9984fa15098771fc451f9ae51c82824b6a40fd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Generate local infrastructure environment
        run: node poc/scripts/init-local-env.mjs --force

      - name: Start Gitea
        run: docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml up -d gitea

      - name: Bootstrap protected Gitea repository and Runner read credential
        run: bash poc/scripts/bootstrap-gitea.sh

      - name: Create controlled feature-branch fixture
        run: bash poc/scripts/phase5a-create-fixture.sh

      - name: Start Controlled Test Runner
        run: |
          set -a
          source poc/infra/.env
          source poc/infra/runtime/runner.env
          set +a
          export GITEA_RUNNER_BASE_URL="$GITEA_RUNNER_BASE_URL"
          npm --prefix poc run start -w @thesis/test-runner-controller > /tmp/test-runner.log 2>&1 &
          echo $! > /tmp/test-runner.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8095/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/test-runner.log
          exit 1

      - name: Run exact-SHA isolated validation
        run: node poc/scripts/phase6b-isolated-smoke.mjs

      - name: Verify execution container was destroyed
        run: |
          remaining="$(docker ps -a --filter 'name=delegation-runner-' --format '{{.Names}}')"
          if [[ -n "$remaining" ]]; then
            echo "Runner left execution containers behind:" >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi

      - name: Show Phase 6B logs on failure
        if: failure()
        run: |
          echo "=== Test Runner ==="
          cat /tmp/test-runner.log || true
          echo "=== Gitea ==="
          docker logs delegation-poc-gitea || true
          echo "=== Residual execution containers ==="
          docker ps -a --filter 'name=delegation-runner-' || true

      - name: Stop Phase 6B services
        if: always()
        run: |
          kill "$(cat /tmp/test-runner.pid)" 2>/dev/null || true
          docker ps -aq --filter 'name=delegation-runner-' | xargs -r docker rm -f
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml down -v

