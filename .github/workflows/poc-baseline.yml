name: PoC Baseline Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust regression tests
        run: cargo test

      - name: Adapter formatting
        run: cargo fmt --manifest-path services/delegation-adapter/Cargo.toml --check

      - name: Adapter unit tests
        run: cargo test --manifest-path services/delegation-adapter/Cargo.toml

      - name: PoC scaffold sanity check
        run: npm --prefix poc run check:scaffold

      - name: Gateway Phase 5A tests
        run: npm --prefix poc run gateway:test

      - name: Runner Phase 6A contract tests
        run: npm --prefix poc run test -w @thesis/test-runner-controller

      - name: OPA Phase 4A policy tests
        run: bash poc/scripts/phase4a-policy-test.sh

  phase1-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Generate local Phase 1 environment
        run: node poc/scripts/init-local-env.mjs --force

      - name: Validate Compose model
        run: docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml config

      - name: Start and validate Phase 1 infrastructure
        run: bash poc/scripts/phase1-up.sh

      - name: Tear down Phase 1 infrastructure
        if: always()
        run: bash poc/scripts/phase1-down.sh --volumes


  phase4-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADAPTER_CALLER_ENGINEER: engineer-phase3-secret
      ADAPTER_CALLER_GATEWAY: gateway-phase3-secret
      ADAPTER_CALLER_ORCHESTRATOR: orchestrator-phase3-secret
      ADAPTER_CALLER_BACKEND: backend-phase3-secret
      ADAPTER_CALLER_FRONTEND: frontend-phase3-secret
      ADAPTER_CALLER_TEST: test-phase3-secret
      ADAPTER_ID_ENGINEER: did:thesis:engineer
      ADAPTER_ID_GATEWAY: urn:thesis:service:gateway
      ADAPTER_ID_ORCHESTRATOR: did:thesis:orchestrator
      ADAPTER_ID_BACKEND: did:thesis:backend-agent
      ADAPTER_ID_FRONTEND: did:thesis:frontend-agent
      ADAPTER_ID_TEST: did:thesis:test-agent
      ADAPTER_BIND_ADDR: 127.0.0.1:8090
      DELEGATION_ADAPTER_URL: http://127.0.0.1:8090
      GATEWAY_BIND_ADDR: 127.0.0.1:8080
      GATEWAY_AUDIENCE: cloud-access-gateway
      GATEWAY_REQUEST_TTL_MS: "120000"
      GATEWAY_RESOURCE_AUTHORITY: gitea.local
      GITEA_OWNER: thesis
      GITEA_REPOSITORY: iam-console-poc
      OPA_URL: http://127.0.0.1:8181
      OPA_TIMEOUT_MS: "2000"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Start OPA with thesis policy
        run: |
          docker run --rm -d --name phase4-opa \
            -p 127.0.0.1:8181:8181 \
            -v "$GITHUB_WORKSPACE/poc/opa:/policy:ro" \
            openpolicyagent/opa:1.21.1 \
            run --server --addr=0.0.0.0:8181 /policy
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8181/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs phase4-opa
          exit 1

      - name: Build Delegation Adapter
        run: cargo build --manifest-path services/delegation-adapter/Cargo.toml

      - name: Start Delegation Adapter
        run: |
          cargo run --manifest-path services/delegation-adapter/Cargo.toml > /tmp/adapter.log 2>&1 &
          echo $! > /tmp/adapter.pid

      - name: Start Gateway
        run: |
          npm --prefix poc run gateway:start > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

      - name: Run real Adapter-Gateway-OPA smoke
        run: node poc/scripts/phase4-smoke.mjs

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Adapter ==="
          cat /tmp/adapter.log || true
          echo "=== Gateway ==="
          cat /tmp/gateway.log || true
          echo "=== OPA ==="
          docker logs phase4-opa || true

      - name: Stop Phase 4 services
        if: always()
        run: |
          kill "$(cat /tmp/gateway.pid)" 2>/dev/null || true
          kill "$(cat /tmp/adapter.pid)" 2>/dev/null || true
          docker rm -f phase4-opa 2>/dev/null || true


  phase5a-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADAPTER_CALLER_ENGINEER: engineer-phase5a-secret
      ADAPTER_CALLER_GATEWAY: gateway-phase5a-secret
      ADAPTER_CALLER_ORCHESTRATOR: orchestrator-phase5a-secret
      ADAPTER_CALLER_BACKEND: backend-phase5a-secret
      ADAPTER_CALLER_FRONTEND: frontend-phase5a-secret
      ADAPTER_CALLER_TEST: test-phase5a-secret
      ADAPTER_ID_ENGINEER: did:thesis:engineer
      ADAPTER_ID_GATEWAY: urn:thesis:service:gateway
      ADAPTER_ID_ORCHESTRATOR: did:thesis:orchestrator
      ADAPTER_ID_BACKEND: did:thesis:backend-agent
      ADAPTER_ID_FRONTEND: did:thesis:frontend-agent
      ADAPTER_ID_TEST: did:thesis:test-agent
      ADAPTER_BIND_ADDR: 127.0.0.1:8090
      DELEGATION_ADAPTER_URL: http://127.0.0.1:8090
      GATEWAY_BIND_ADDR: 127.0.0.1:8080
      GATEWAY_AUDIENCE: cloud-access-gateway
      GATEWAY_REQUEST_TTL_MS: "120000"
      GATEWAY_RESOURCE_AUTHORITY: gitea.local
      GATEWAY_PROVIDER_MODE: gitea-readonly
      GITEA_OWNER: thesis
      GITEA_REPOSITORY: iam-console-poc
      GITEA_TIMEOUT_MS: "3000"
      OPA_URL: http://127.0.0.1:8181
      OPA_TIMEOUT_MS: "2000"
      EXPECTED_GITEA_REVISION: ea9984fa15098771fc451f9ae51c82824b6a40fd
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Generate local infrastructure environment
        run: node poc/scripts/init-local-env.mjs --force

      - name: Start Gitea and OPA
        run: docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml up -d gitea opa

      - name: Bootstrap protected Gitea repository
        run: bash poc/scripts/bootstrap-gitea.sh

      - name: Create read-only feature-branch fixture
        run: bash poc/scripts/phase5a-create-fixture.sh

      - name: Build Delegation Adapter
        run: cargo build --manifest-path services/delegation-adapter/Cargo.toml

      - name: Start Delegation Adapter
        run: |
          cargo run --manifest-path services/delegation-adapter/Cargo.toml > /tmp/adapter.log 2>&1 &
          echo $! > /tmp/adapter.pid

      - name: Start Gateway with read-only Gitea provider
        run: |
          set -a
          source poc/infra/runtime/gateway.env
          set +a
          export GITEA_BASE_URL="$GITEA_HOST_BASE_URL"
          export GATEWAY_PROVIDER_MODE=gitea-readonly
          export DELEGATION_ADAPTER_URL=http://127.0.0.1:8090
          export OPA_URL=http://127.0.0.1:8181
          npm --prefix poc run gateway:start > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

      - name: Run real Verifier-OPA-Gitea read-only smoke
        run: node poc/scripts/phase5a-smoke.mjs

      - name: Show Phase 5A logs on failure
        if: failure()
        run: |
          echo "=== Adapter ==="
          cat /tmp/adapter.log || true
          echo "=== Gateway ==="
          cat /tmp/gateway.log || true
          echo "=== Gitea ==="
          docker logs delegation-poc-gitea || true
          echo "=== OPA ==="
          docker logs delegation-poc-opa || true

      - name: Stop Phase 5A services
        if: always()
        run: |
          kill "$(cat /tmp/gateway.pid)" 2>/dev/null || true
          kill "$(cat /tmp/adapter.pid)" 2>/dev/null || true
          docker compose --env-file poc/infra/.env -f poc/infra/docker-compose.yml down -v


