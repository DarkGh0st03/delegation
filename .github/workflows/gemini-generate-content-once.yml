name: Gemini GenerateContent Isolated One-Shot

# A one-off, explicitly user-authorized provider-only smoke.
on:
  push:
    branches: [refactor/adk-integration]
    paths:
      - '.github/gemini-generate-content-once.trigger'

permissions:
  contents: read

concurrency:
  group: gemini-generatecontent-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-only:
    if: ${{ contains(github.event.head_commit.message, 'Gemini generateContent one-shot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GEMINI_API_KEY: ${{ secrets.Delegation_Thesis_Gemini }}
      GEMINI_MODEL: gemini-3.8-flash
      GOOGLE_GENAI_USE_VERTEXAI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Verify one-off marker and existing Free Tier key
        run: |
          test -f .github/gemini-generate-content-once.trigger
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Missing Gemini Free Tier secret' >&2
            exit 1
          fi
      - name: Single synthetic generateContent, no ADK or infrastructure
        run: node --experimental-strip-types poc/packages/agent-runtime/scripts/gemini-api-health-smoke.mjs
