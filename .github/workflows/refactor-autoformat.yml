name: Temporary Phase 1 Validation

on:
  push:
    branches:
      - refactor/core-cleanup
    paths:
      - .github/workflows/refactor-autoformat.yml
      - src/delegation/accumulator/accumulator_verifier.rs

permissions:
  contents: read

jobs:
  validate-parallel-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - name: Rust formatting
        run: cargo fmt --check

      - name: Default Rust tests
        run: cargo test

      - name: Parallel verification tests
        run: cargo test --features parallel_verification

      - name: All feature tests
        run: cargo test --all-features
