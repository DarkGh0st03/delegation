name: Temporary Refactor Rustfmt

on:
  push:
    branches:
      - refactor/core-cleanup
    paths:
      - .github/workflows/refactor-autoformat.yml
      - src/delegation/accumulator/accumulator_verifier.rs

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-cleanup

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - name: Format Rust
        run: cargo fmt

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/delegation/accumulator/accumulator_verifier.rs
          git commit -m "style: apply rustfmt to accumulator verifier"
          git push origin HEAD:refactor/core-cleanup
