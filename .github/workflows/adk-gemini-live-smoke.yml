name: ADK Gemini Native Live Smoke

# Live requests are ALWAYS explicit. Ordinary branch pushes run no Gemini API call.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual Gemini health, function smoke, or a single isolated Backend case'
        type: choice
        required: true
        default: api-health
        options: [api-health, adk-function, backend-shape, backend-a, backend-b, backend-c]
      model:
        description: 'Gemini model available to your Gemini Developer API project'
        type: string
        required: true
        default: gemini-3.8-flash

permissions:
  contents: read

concurrency:
  group: adk-gemini-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly-gemini-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GEMINI_API_KEY: ${{ secrets.Delegation_Thesis_Gemini }}
      GEMINI_MODEL: ${{ inputs.model }}
      GOOGLE_GENAI_USE_VERTEXAI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - name: Ensure user-named Gemini Free Tier secret is present
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Missing GitHub secret Delegation_Thesis_Gemini.' >&2
            exit 1
          fi
      - name: Gemini API health (one synthetic request, no ADK or infrastructure)
        if: ${{ inputs.mode == 'api-health' }}
        run: node --experimental-strip-types poc/packages/agent-runtime/scripts/gemini-api-health-smoke.mjs
      - name: Install ADK dependencies for isolated function calling
        if: ${{ inputs.mode == 'adk-function' || startsWith(inputs.mode, 'backend-') }}
        run: npm --prefix poc ci --ignore-scripts --no-audit --no-fund
      - name: Gemini ADK synthetic read-only tool (separate, explicit mode)
        if: ${{ inputs.mode == 'adk-function' }}
        run: node --experimental-strip-types poc/packages/agent-runtime/scripts/gemini-live-smoke.mjs
      # Backend-shaped live inference is a DIFFERENT explicit dispatch mode.
      # One provider request max; in-memory fixture, no infrastructure or writes.
      # One and only one case per manual dispatch. Keep the original
      # backend-shape choice as a backwards-compatible alias for case C.
      - name: Gemini ADK Backend-shaped isolated single-turn probe
        if: ${{ inputs.mode == 'backend-shape' || inputs.mode == 'backend-a' || inputs.mode == 'backend-b' || inputs.mode == 'backend-c' }}
        env:
          GEMINI_BACKEND_CASE: ${{ inputs.mode == 'backend-a' && 'A' || inputs.mode == 'backend-b' && 'B' || 'C' }}
        run: node --experimental-strip-types poc/packages/agent-runtime/scripts/gemini-backend-shape-smoke.mjs
