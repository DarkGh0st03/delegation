name: Temporary Phase 2 Validation

on:
  push:
    branches:
      - refactor/core-cleanup

permissions:
  contents: read

jobs:
  validate-contract-split:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - name: Core formatting
        run: cargo fmt --check

      - name: Core tests
        run: cargo test 2>&1 | tee core-test.log

      - name: Parallel verification feature tests
        run: cargo test --features parallel_verification 2>&1 | tee parallel-test.log

      - name: All feature tests
        run: cargo test --all-features 2>&1 | tee all-features-test.log

      - name: Adapter formatting
        run: cargo fmt --manifest-path services/delegation-adapter/Cargo.toml --check

      - name: Adapter tests
        run: cargo test --manifest-path services/delegation-adapter/Cargo.toml 2>&1 | tee adapter-test.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-validation-logs
          path: |
            core-test.log
            parallel-test.log
            all-features-test.log
            adapter-test.log
          if-no-files-found: ignore
