name: Temporary Phase 2 Validation

on:
  push:
    branches:
      - refactor/core-cleanup

permissions:
  contents: read

jobs:
  diagnose-contract-split:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - name: Core formatting
        run: cargo fmt --check

      - name: Compile core tests and capture diagnostics
        run: cargo test --no-run 2>&1 | tee core-test.log

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-core-test-log
          path: core-test.log
