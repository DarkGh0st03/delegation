[package]
name = "delegation"
version = "0.1.0"
edition = "2024"

[features]
default = []
efficient = []
parallel_verification = []

[dependencies]
josekit = "0.10.3"
serde = { version = "1.0.210", default-features = false }
serde_json = { version = "1.0.128", default-features = false }
rand = "0.10.2"
multibase = "0.9.1"
digest = "0.11.3"
sha2 = "0.11.0"
csv = "1.3.1"

ark-ec = "0.4.2"
ark-bn254 = "0.4.0"
ark-std = { version = "0.4.0", features = ["getrandom"] }
ark-ff = "0.4.2"
ark-serialize = "0.4.2"
vb_accumulator = { version = "0.29.0", default-features = false }

ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

