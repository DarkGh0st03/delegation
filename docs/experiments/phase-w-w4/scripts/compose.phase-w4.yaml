services:
  app:
    image: delegation-app:phase-w4
    pull_policy: never
    environment:
      DELEGATION_FREE_MODES: "1"
      GEMINI_API_KEY: ""
      DELEGATION_BATCH_READS: "${DELEGATION_BATCH_READS:-1}"
      DELEGATION_BATCH_WRITES: "${DELEGATION_BATCH_WRITES:-1}"
      DELEGATION_SCRIPTED_PLAN_FILES: "${DELEGATION_SCRIPTED_PLAN_FILES:-15}"
      DELEGATION_W4_PROBE: "${DELEGATION_W4_PROBE:-}"
